; Chaos lab PgBouncer: transaction pooling, NO timeouts (mirrors the prod incident setup).
[databases]
app = host=chaoslab-pg port=5432 dbname=app user=postgres

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = any
pool_mode = transaction
default_pool_size = 5
max_client_conn = 200
admin_users = postgres
ignore_startup_parameters = extra_float_digits
; defaults left on purpose: query_timeout=0, idle_transaction_timeout=0, client_idle_timeout=0
logfile =
pidfile =
