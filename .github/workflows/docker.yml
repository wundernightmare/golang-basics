name: docker

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

# Read-only until the push step below is enabled — then add `packages: write`
# to *that* job only (never at workflow level for pull requests).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Same names as .env.example / the GitLab variables; empty = public upstream.
env:
  DOCKER_HUB: ${{ vars.DOCKER_HUB || 'docker.io' }}
  GCR: ${{ vars.GCR || 'gcr.io' }}
  GOPROXY: ${{ vars.GOPROXY || 'https://proxy.golang.org,direct' }}
  GONOSUMDB: ${{ vars.GONOSUMDB }}
  GRYPE_DB_UPDATE_URL: ${{ vars.GRYPE_DB_UPDATE_URL }}
  GRYPE_DB_AUTO_UPDATE: ${{ vars.GRYPE_DB_AUTO_UPDATE }}
  # Accept the bundled vuln DB even if older than grype's 5-day default
  # (CI's clock can run ahead of the latest published DB).
  GRYPE_DB_VALIDATE_AGE: "false"

jobs:
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      SYFT_VERSION: ${{ steps.pins.outputs.SYFT_VERSION }}
      GRYPE_VERSION: ${{ steps.pins.outputs.GRYPE_VERSION }}
      SERVICES: ${{ steps.svc.outputs.SERVICES }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pins
        run: scripts/mise-pins.sh >> "$GITHUB_OUTPUT"
      - id: svc
        run: echo "SERVICES=$(find services -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort | jq -Rsc 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  build:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.versions.outputs.SERVICES) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image (load locally for scan)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          load: true
          tags: golang-basics-${{ matrix.service }}:ci
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
            DOCKER_HUB=${{ env.DOCKER_HUB }}
            GCR=${{ env.GCR }}
            GOPROXY=${{ env.GOPROXY }}
            GONOSUMDB=${{ env.GONOSUMDB }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # syft + grype from the same version-pinned images as the GitLab job,
      # against a `docker save` tar — identical commands, identical findings.
      - name: SBOM (syft) + CVE scan (grype, fail on high)
        run: |
          docker save -o "image-${{ matrix.service }}.tar" "golang-basics-${{ matrix.service }}:ci"
          docker run --rm -v "$PWD:/w" -w /w \
            "${DOCKER_HUB}/anchore/syft:v${{ needs.versions.outputs.SYFT_VERSION }}" \
            "docker-archive:image-${{ matrix.service }}.tar" -o "cyclonedx-json=sbom-${{ matrix.service }}.json"
          # Forward only the grype knobs that are actually set (an empty
          # GRYPE_DB_UPDATE_URL would override grype's default with "").
          pass=(); for v in GRYPE_DB_VALIDATE_AGE GRYPE_DB_UPDATE_URL GRYPE_DB_AUTO_UPDATE HTTPS_PROXY NO_PROXY; do
            [ -n "${!v:-}" ] && pass+=(-e "$v")
          done
          docker run --rm -v "$PWD:/w" -w /w "${pass[@]}" \
            "${DOCKER_HUB}/anchore/grype:v${{ needs.versions.outputs.GRYPE_VERSION }}" \
            "docker-archive:image-${{ matrix.service }}.tar" --config .grype.yaml --fail-on high

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.json
          retention-days: 7

      # Push only happens on master / tags — wire to your registry of choice
      # and give this job `permissions: packages: write`.
      # - name: Login + push
      #   if: github.event_name == 'push'
      #   uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      #   with:
      #     context: .
      #     file: services/${{ matrix.service }}/Dockerfile
      #     push: true
      #     tags: ghcr.io/tracehubmmp/golang-basics-${{ matrix.service }}:latest
