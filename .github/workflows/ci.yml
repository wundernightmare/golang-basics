name: ci

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 3 * * *" # nightly: mutation testing (see `mutation` below)
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a newer push to a PR cancels the in-flight run (GitLab's
# `interruptible: true`); pushes to master always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Closed-network knobs come from repository / organisation *variables* under the
# same names as .env.example and fall back to the public upstreams. Nothing in
# this file hard-codes a host or a tool version.
env:
  GOPROXY: ${{ vars.GOPROXY || 'https://proxy.golang.org,direct' }}
  GONOSUMDB: ${{ vars.GONOSUMDB }}
  GOTOOLCHAIN: local
  # Determinism hygiene: a fixed zone so time-formatting tests cannot depend on
  # the runner, and a shuffled test order so inter-test coupling shows up here
  # rather than in someone's local run. -shuffle prints the seed on failure.
  TZ: UTC
  GOFLAGS: -shuffle=on

jobs:
  # Single source of truth: tool pins are read out of mise.toml by
  # scripts/mise-pins.sh (the GitLab `versions` job runs the same script) and
  # the module lists out of go.work / go.mod, so adding a module or bumping a
  # tool never touches this file.
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      GO_VERSION: ${{ steps.pins.outputs.GO_VERSION }}
      NODE_VERSION: ${{ steps.pins.outputs.NODE_VERSION }}
      GOLANGCI_VERSION: ${{ steps.pins.outputs.GOLANGCI_VERSION }}
      GOTESTCOV_VERSION: ${{ steps.pins.outputs.GOTESTCOV_VERSION }}
      GREMLINS_VERSION: ${{ steps.pins.outputs.GREMLINS_VERSION }}
      OAPICODEGEN_VERSION: ${{ steps.pins.outputs.OAPICODEGEN_VERSION }}
      GOJSONSCHEMA_VERSION: ${{ steps.pins.outputs.GOJSONSCHEMA_VERSION }}
      OASDIFF_VERSION: ${{ steps.pins.outputs.OASDIFF_VERSION }}
      BENCHSTAT_VERSION: ${{ steps.pins.outputs.BENCHSTAT_VERSION }}
      MODULES: ${{ steps.mods.outputs.MODULES }}
      DATA_MODULES: ${{ steps.mods.outputs.DATA_MODULES }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pins
        run: scripts/mise-pins.sh >> "$GITHUB_OUTPUT"
      - id: mods
        run: |
          json() { jq -Rsc 'split("\n") | map(select(length > 0))'; }
          {
            echo "MODULES=$(scripts/touched-modules.sh --all | json)"
            # Modules with container-backed suites: the ones that import testcontainers.
            echo "DATA_MODULES=$(grep -ls testcontainers-go libs/*/go.mod services/*/go.mod | xargs -n1 dirname | json)"
          } >> "$GITHUB_OUTPUT"

  fmt:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.versions.outputs.GO_VERSION }}
      - name: gofmt
        run: |
          # Scoped to the module trees, matching `just fmt-check` and GitLab.
          out="$(gofmt -l ./libs ./services)"
          if [ -n "$out" ]; then echo "gofmt needed in:"; echo "$out"; exit 1; fi

  # Contracts: the TypeSpec source (api/tsp) is compiled and the Go types
  # regenerated; the commit must already contain exactly that output, and the
  # HTTP contract must not break against master (oasdiff). Same as
  # `just contracts-check`.
  contracts:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # master's spec for the breaking-change diff
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.versions.outputs.GO_VERSION }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.versions.outputs.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          go install "github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v${{ needs.versions.outputs.OAPICODEGEN_VERSION }}"
          go install "github.com/atombender/go-jsonschema@v${{ needs.versions.outputs.GOJSONSCHEMA_VERSION }}"
          go install "github.com/oasdiff/oasdiff@v${{ needs.versions.outputs.OASDIFF_VERSION }}"
      - name: regenerate and compare
        run: |
          pnpm --filter @golang-basics/api compile
          oapi-codegen -config api/oapi-codegen.yaml api/openapi3/tasks.openapi.yaml
          go-jsonschema -p events --only-models --schema-root-type TaskCreatedEvent=TaskCreatedEvent \
            -o libs/contracts/events/task_created.gen.go api/jsonschema/TaskCreatedEvent.json
          (cd libs/contracts && gofmt -w . && go build ./...)
          git diff --exit-code --stat -- api/openapi3 api/jsonschema libs/contracts \
            || { echo "::error::contracts are stale — run 'just contracts' and commit"; exit 1; }
      - name: breaking changes against master
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }} # never interpolate github.* into run: text (shell injection)
        run: |
          if git show "origin/$BASE_REF:api/openapi3/tasks.openapi.yaml" > /tmp/base.yaml 2>/dev/null; then
            oasdiff breaking /tmp/base.yaml api/openapi3/tasks.openapi.yaml --fail-on ERR --err-ignore api/oasdiff-breaking.ignore
          else
            echo "no base spec on $BASE_REF — first version"
          fi

  lint-test:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.versions.outputs.MODULES) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.versions.outputs.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v${{ needs.versions.outputs.GOLANGCI_VERSION }}
          working-directory: ${{ matrix.module }}
      # Unit tests only here — the container-backed suites run in `integration`.
      # Coverage goes to .cover/unit in Go's binary format (every workspace
      # package instrumented) so the `coverage` job can covdata-merge it with
      # the integration and e2e layers; every test is an Allure test (testx)
      # and writes its result where ALLURE_RESULTS_DIR points.
      - name: go test (short, race, coverage)
        working-directory: ${{ matrix.module }}
        env:
          ALLURE_RESULTS_DIR: ${{ github.workspace }}/allure-results
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.cover/unit"
          go test -short -race -cover -covermode=atomic -coverpkg=github.com/tracehubmmp/golang-basics/... ./... \
            -args -test.gocoverdir="$GITHUB_WORKSPACE/.cover/unit"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cover-unit-${{ hashFiles(format('{0}/go.mod', matrix.module)) }}
          path: .cover/unit
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && hashFiles('allure-results/**') != ''
        with:
          name: allure-results-unit-${{ hashFiles(format('{0}/go.mod', matrix.module)) }}
          path: allure-results
          retention-days: 7

  # Container-backed integration tests (Postgres / Valkey / Kafka via
  # testcontainers). GitHub runners ship a working Docker daemon, so the suites
  # that skip locally when Docker is absent run for real here (CI is set, which
  # makes a container-start failure fail the job instead of skipping).
  integration:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.versions.outputs.DATA_MODULES) }}
    env:
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ${{ vars.TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.versions.outputs.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: go test (integration, coverage)
        working-directory: ${{ matrix.module }}
        env:
          ALLURE_RESULTS_DIR: ${{ github.workspace }}/allure-results
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.cover/integration"
          go test -cover -covermode=atomic -coverpkg=github.com/tracehubmmp/golang-basics/... ./... \
            -args -test.gocoverdir="$GITHUB_WORKSPACE/.cover/integration"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cover-integration-${{ hashFiles(format('{0}/go.mod', matrix.module)) }}
          path: .cover/integration
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && hashFiles('allure-results/**') != ''
        with:
          name: allure-results-integration-${{ hashFiles(format('{0}/go.mod', matrix.module)) }}
          path: allure-results
          retention-days: 7

  # One coverage number for the whole pyramid: the unit, integration and e2e
  # layers are covdata-merged (counters summed per block, nothing counted
  # twice) and gated by .testcoverage.yml — the same as `just cov-check`.
  coverage:
    needs: [versions, lint-test, integration, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.versions.outputs.GO_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cover-unit-*
          path: .cover/unit
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cover-integration-*
          path: .cover/integration
          merge-multiple: true
      # The e2e upload is `if-no-files-found: ignore`, so this artifact can be
      # absent (no counters flushed); cover.sh merge then warns and skips the
      # layer instead of the job failing on the download.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: cover-e2e
          path: .cover/e2e
      # master's per-package breakdown, saved by the last push to master (below)
      # and restored here so a PR is measured against it: no coverage regression.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: base
        with:
          path: coverage-breakdown-base.json
          key: coverage-breakdown-master-${{ github.sha }}
          restore-keys: coverage-breakdown-master-
      - name: merge layers and gate
        run: |
          set -o pipefail # a failed merge must fail the step even through tee
          go install "github.com/vladopajic/go-test-coverage/v2@v${{ needs.versions.outputs.GOTESTCOV_VERSION }}"
          scripts/cover.sh merge | tee coverage-layers.txt
          # The no-regression diff is a pull-request gate; a push to master is
          # the new base, measured against the absolute thresholds only.
          diff_args=()
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -s coverage-breakdown-base.json ]; then
            diff_args=(--diff-base-breakdown-file-name coverage-breakdown-base.json --diff-threshold 0)
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "no base breakdown for master yet — absolute thresholds only"
          fi
          go-test-coverage --config .testcoverage.yml "${diff_args[@]}" | tee coverage-summary.txt
          { echo '### Coverage — unit + integration + e2e (covdata merge)'; echo '```'; cat coverage-layers.txt coverage-summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: keep this breakdown as the base for pull requests
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: cp coverage-breakdown.json coverage-breakdown-base.json
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        with:
          path: coverage-breakdown-base.json
          key: coverage-breakdown-master-${{ github.sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-merged
          path: |
            coverage-merged.out
            coverage-breakdown.json
          retention-days: 7

  # One Allure HTML report from every suite's results (unit + integration +
  # e2e + schemathesis). allure-commandline is a Node package (root
  # package.json) and needs a JRE.
  allure-report:
    needs: [versions, lint-test, integration, e2e, schemathesis]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.versions.outputs.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
      - run: pnpm install --frozen-lockfile
      # categories.json + executor.json next to the merged results. The script
      # reads the runner's default GITHUB_* variables (no github.* context in
      # run: text) — same as `just allure-report` and the GitLab job.
      - run: scripts/allure-meta.sh allure-results
      - run: pnpm exec allure generate --clean --single-file -o allure-report allure-results
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-report
          path: allure-report/index.html
          retention-days: 14

  # Flakiness hunt — nightly or on demand: every layer three times, shuffled,
  # under the race detector. A test that passes here 3/3 for weeks and fails
  # once on a PR is a real flake and gets marked (testo-allure Flaky) with a
  # ticket, never a silent retry.
  stress:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.versions.outputs.MODULES) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.versions.outputs.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - working-directory: ${{ matrix.module }}
        run: go test -count=3 -race -shuffle=on ./...

  # Fuzzing — nightly or on demand: every Fuzz* target for a fixed budget, the
  # corpus of any crash is uploaded so the failing input can be replayed.
  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.versions.outputs.GO_VERSION }}
      - run: FUZZTIME=45s scripts/fuzz.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"

  # Micro-benchmarks — nightly or on demand: the Benchmark* functions run with
  # enough repetitions for benchstat, master's numbers are kept (cache) and
  # the comparison is printed on the run page. Informational: a regression
  # is a finding to act on, not an automatic failure — benchmark noise on
  # shared runners would make a hard gate flaky.
  bench:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.versions.outputs.GO_VERSION }}
      - run: go install "golang.org/x/perf/cmd/benchstat@v${{ needs.versions.outputs.BENCHSTAT_VERSION }}"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bench-base.txt
          key: bench-master-${{ github.sha }}
          restore-keys: bench-master-
      - name: run and compare
        run: |
          scripts/bench.sh bench-head.txt
          { echo '### Benchmarks (benchstat, master → this run)'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ -s bench-base.txt ]; then
            benchstat bench-base.txt bench-head.txt | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "no base yet" | tee -a "$GITHUB_STEP_SUMMARY"; benchstat bench-head.txt >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cp bench-head.txt bench-base.txt
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/master'
        with:
          path: bench-base.txt
          key: bench-master-${{ github.sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-${{ github.sha }}
          path: bench-head.txt
          retention-days: 30

  # Mutation testing of the pure-logic modules — nightly or on demand, not per
  # PR: it re-runs the suite once per mutant. Thresholds live in each
  # module's .gremlins.yaml; a drop below them fails the job.
  mutation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: [libs/resilient-http-client]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.versions.outputs.GO_VERSION }}
      - run: go install "github.com/go-gremlins/gremlins/cmd/gremlins@v${{ needs.versions.outputs.GREMLINS_VERSION }}"
      - working-directory: ${{ matrix.module }}
        env:
          GOFLAGS: -count=1 # timeout is derived from the coverage run; never let it hit the cache
        run: gremlins unleash --output "$GITHUB_WORKSPACE/gremlins-$(basename "${{ matrix.module }}").json" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gremlins-${{ hashFiles(format('{0}/go.mod', matrix.module)) }}
          path: gremlins-*.json
          retention-days: 14

  # The full suite — ping, heartbeat, tasks and consumer against real Postgres
  # / Valkey / Redpanda from docker/deps.yml — the same scope as the GitLab
  # job, so the two pipelines prove the same thing.
  e2e:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COREPACK_NPM_REGISTRY: ${{ vars.COREPACK_NPM_REGISTRY }}
      npm_config_registry: ${{ vars.NPM_REGISTRY }}
      DOCKER_HUB: ${{ vars.DOCKER_HUB || 'docker.io' }}
      E2E_WITH_DEPS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: deps (Postgres, Valkey, Redpanda)
        run: |
          docker compose -f docker/deps.yml up -d
          for _ in $(seq 1 60); do
            docker inspect --format '{{.State.Health.Status}}' golang-basics-redpanda 2>/dev/null | grep -q healthy && break
            sleep 2
          done
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.versions.outputs.GO_VERSION }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.versions.outputs.NODE_VERSION }}
          cache: pnpm
      # Cover-instrumented binaries: the e2e layer contributes to the merged
      # coverage through GOCOVERDIR, and Playwright reports to Allure like
      # every other layer.
      - name: build service binaries (cover-instrumented)
        env:
          VERSION: ${{ github.sha }}
          COVER: "1"
        run: |
          for s in ping heartbeat tasks consumer; do scripts/build-service.sh "$s"; done
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: playwright e2e
        env:
          GOCOVERDIR: ${{ github.workspace }}/.cover/e2e
          ALLURE_RESULTS_DIR: ${{ github.workspace }}/allure-results
        run: |
          mkdir -p "$GOCOVERDIR"
          pnpm --filter @golang-basics/e2e test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cover-e2e
          path: .cover/e2e
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && hashFiles('allure-results/**') != ''
        with:
          name: allure-results-e2e
          path: allure-results
          retention-days: 7
      - if: always()
        run: docker compose -f docker/deps.yml down -v

  # Generative API testing: Schemathesis drives the real ping and tasks
  # binaries with requests generated from their OpenAPI documents (positive,
  # negative, stateful) and checks every response against the contract. The
  # deps come from docker/deps.yml, the same stack `just infra-up` runs.
  schemathesis:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALLURE_RESULTS_DIR: ${{ github.workspace }}/allure-results
      DOCKER_HUB: ${{ vars.DOCKER_HUB || 'docker.io' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.versions.outputs.GO_VERSION }}
      - name: deps (Postgres, Valkey, Redpanda)
        run: |
          docker compose -f docker/deps.yml up -d
          for _ in $(seq 1 60); do
            docker inspect --format '{{.State.Health.Status}}' golang-basics-redpanda 2>/dev/null | grep -q healthy && break
            sleep 2
          done
      - run: scripts/schemathesis.sh ping
      - run: scripts/schemathesis.sh tasks
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && hashFiles('allure-results/**') != ''
        with:
          name: allure-results-schemathesis
          path: allure-results
          retention-days: 7
      - if: always()
        run: docker compose -f docker/deps.yml down -v

  # Final status check for branch protection — the one required check.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [fmt, contracts, lint-test, integration, e2e, schemathesis, coverage]
    if: always()
    steps:
      - name: verify all jobs passed
        run: |
          for r in "${{ needs.fmt.result }}" "${{ needs.contracts.result }}" "${{ needs.lint-test.result }}" \
                   "${{ needs.integration.result }}" "${{ needs.e2e.result }}" "${{ needs.schemathesis.result }}" \
                   "${{ needs.coverage.result }}"; do
            [ "$r" = "success" ] || { echo "a required job did not succeed ($r)"; exit 1; }
          done
          echo "CI gate passed"
