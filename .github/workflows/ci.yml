name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  # Single source of truth: read the pinned tool versions straight out of
  # mise.toml so CI uses exactly what local dev does (no drift between
  # `mise install` and a hard-coded `go-version`).
  versions:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.v.outputs.go }}
      golangci: ${{ steps.v.outputs.golangci }}
      node: ${{ steps.v.outputs.node }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          mt=mise.toml
          {
            echo "go=$(sed -n 's/^go[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$mt")"
            echo "golangci=$(sed -n 's/^golangci-lint[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$mt")"
            echo "node=$(sed -n 's/^node[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$mt")"
          } >> "$GITHUB_OUTPUT"

  fmt:
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.versions.outputs.go }}
      - name: gofmt
        run: |
          # Scoped to the module trees, matching `just fmt-check` and GitLab.
          out="$(gofmt -l ./libs ./services)"
          if [ -n "$out" ]; then echo "gofmt needed in:"; echo "$out"; exit 1; fi

  lint-test:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - libs/httpx
          - libs/resilient-http-client
          - libs/pgx
          - libs/valkey
          - libs/kafka
          - libs/otelx
          - services/ping
          - services/heartbeat
          - services/tasks
          - services/consumer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.versions.outputs.go }}
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v${{ needs.versions.outputs.golangci }}
          working-directory: ${{ matrix.module }}
      # Unit tests only here — the container-backed suites run in `integration`.
      - name: go test (short, race)
        working-directory: ${{ matrix.module }}
        run: go test -short -race ./...

  # Container-backed integration tests (Postgres / Valkey / Kafka via
  # testcontainers). GitHub runners ship a working Docker daemon, so the suites
  # that skip locally when Docker is absent run for real here (CI is set, which
  # makes a container-start failure fail the job instead of skipping).
  integration:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [libs/pgx, libs/valkey, libs/kafka, services/tasks, services/consumer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.versions.outputs.go }}
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: go test (integration)
        working-directory: ${{ matrix.module }}
        run: go test ./...

  # Final status check for branch protection.
  gate:
    runs-on: ubuntu-latest
    needs: [fmt, lint-test, integration]
    if: always()
    steps:
      - name: verify all jobs passed
        run: |
          [ "${{ needs.fmt.result }}" = "success" ] || exit 1
          [ "${{ needs.lint-test.result }}" = "success" ] || exit 1
          [ "${{ needs.integration.result }}" = "success" ] || exit 1
          echo "CI gate passed"

  e2e:
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.versions.outputs.go }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.versions.outputs.node }}
          cache: pnpm
      - name: build service binaries
        run: |
          for s in ping heartbeat; do
            (cd "services/$s" && CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "bin/$s" .)
          done
      - name: pnpm install
        run: pnpm install --frozen-lockfile || pnpm install
      - name: playwright e2e
        run: pnpm --filter @golang-basics/e2e test
