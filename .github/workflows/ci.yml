name: ci

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 3 * * *" # nightly: mutation testing (see `mutation` below)
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a newer push to a PR cancels the in-flight run (GitLab's
# `interruptible: true`); pushes to master always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Closed-network knobs come from repository / organisation *variables* under the
# same names as .env.example and fall back to the public upstreams. Nothing in
# this file hard-codes a host or a tool version.
env:
  GOPROXY: ${{ vars.GOPROXY || 'https://proxy.golang.org,direct' }}
  GONOSUMDB: ${{ vars.GONOSUMDB }}
  GOTOOLCHAIN: local

jobs:
  # Single source of truth: tool pins are read out of mise.toml by
  # scripts/mise-pins.sh (the GitLab `versions` job runs the same script) and
  # the module lists out of go.work / go.mod, so adding a module or bumping a
  # tool never touches this file.
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      GO_VERSION: ${{ steps.pins.outputs.GO_VERSION }}
      NODE_VERSION: ${{ steps.pins.outputs.NODE_VERSION }}
      GOLANGCI_VERSION: ${{ steps.pins.outputs.GOLANGCI_VERSION }}
      GOTESTCOV_VERSION: ${{ steps.pins.outputs.GOTESTCOV_VERSION }}
      GREMLINS_VERSION: ${{ steps.pins.outputs.GREMLINS_VERSION }}
      MODULES: ${{ steps.mods.outputs.MODULES }}
      DATA_MODULES: ${{ steps.mods.outputs.DATA_MODULES }}
    steps:
      - uses: actions/checkout@v4
      - id: pins
        run: scripts/mise-pins.sh >> "$GITHUB_OUTPUT"
      - id: mods
        run: |
          json() { jq -Rsc 'split("\n") | map(select(length > 0))'; }
          {
            echo "MODULES=$(scripts/touched-modules.sh --all | json)"
            # Modules with container-backed suites: the ones that import testcontainers.
            echo "DATA_MODULES=$(grep -ls testcontainers-go libs/*/go.mod services/*/go.mod | xargs -n1 dirname | json)"
          } >> "$GITHUB_OUTPUT"

  fmt:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.versions.outputs.GO_VERSION }}
      - name: gofmt
        run: |
          # Scoped to the module trees, matching `just fmt-check` and GitLab.
          out="$(gofmt -l ./libs ./services)"
          if [ -n "$out" ]; then echo "gofmt needed in:"; echo "$out"; exit 1; fi

  lint-test:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.versions.outputs.MODULES) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.versions.outputs.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v${{ needs.versions.outputs.GOLANGCI_VERSION }}
          working-directory: ${{ matrix.module }}
      # Unit tests only here — the container-backed suites run in `integration`.
      # Coverage goes to .cover/unit in Go's binary format (every workspace
      # package instrumented) so the `coverage` job can covdata-merge it with
      # the integration and e2e layers; every test is an Allure test (testx)
      # and writes its result where ALLURE_RESULTS_DIR points.
      - name: go test (short, race, coverage)
        working-directory: ${{ matrix.module }}
        env:
          ALLURE_RESULTS_DIR: ${{ github.workspace }}/allure-results
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.cover/unit"
          go test -short -race -cover -coverpkg=github.com/tracehubmmp/golang-basics/... ./... \
            -args -test.gocoverdir="$GITHUB_WORKSPACE/.cover/unit"
      - uses: actions/upload-artifact@v4
        with:
          name: cover-unit-${{ hashFiles(format('{0}/go.mod', matrix.module)) }}
          path: .cover/unit
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('allure-results/**') != ''
        with:
          name: allure-results-unit-${{ hashFiles(format('{0}/go.mod', matrix.module)) }}
          path: allure-results
          retention-days: 7

  # Container-backed integration tests (Postgres / Valkey / Kafka via
  # testcontainers). GitHub runners ship a working Docker daemon, so the suites
  # that skip locally when Docker is absent run for real here (CI is set, which
  # makes a container-start failure fail the job instead of skipping).
  integration:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.versions.outputs.DATA_MODULES) }}
    env:
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ${{ vars.TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.versions.outputs.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: go test (integration, coverage)
        working-directory: ${{ matrix.module }}
        env:
          ALLURE_RESULTS_DIR: ${{ github.workspace }}/allure-results
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.cover/integration"
          go test -cover -coverpkg=github.com/tracehubmmp/golang-basics/... ./... \
            -args -test.gocoverdir="$GITHUB_WORKSPACE/.cover/integration"
      - uses: actions/upload-artifact@v4
        with:
          name: cover-integration-${{ hashFiles(format('{0}/go.mod', matrix.module)) }}
          path: .cover/integration
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('allure-results/**') != ''
        with:
          name: allure-results-integration-${{ hashFiles(format('{0}/go.mod', matrix.module)) }}
          path: allure-results
          retention-days: 7

  # One coverage number for the whole pyramid: the unit, integration and e2e
  # layers are covdata-merged (counters summed per block, nothing counted
  # twice) and gated by .testcoverage.yml — the same as `just cov-check`.
  coverage:
    needs: [versions, lint-test, integration, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.versions.outputs.GO_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: cover-unit-*
          path: .cover/unit
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: cover-integration-*
          path: .cover/integration
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: cover-e2e
          path: .cover/e2e
      - name: merge layers and gate
        run: |
          go install "github.com/vladopajic/go-test-coverage/v2@v${{ needs.versions.outputs.GOTESTCOV_VERSION }}"
          scripts/cover.sh merge | tee coverage-layers.txt
          go-test-coverage --config .testcoverage.yml | tee coverage-summary.txt
          { echo '### Coverage — unit + integration + e2e (covdata merge)'; echo '```'; cat coverage-layers.txt coverage-summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-merged
          path: coverage-merged.out
          retention-days: 7

  # One Allure HTML report from every suite's results (unit + integration).
  # allure-commandline is a Node package (root package.json) and needs a JRE.
  allure-report:
    needs: [versions, lint-test, integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.versions.outputs.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec allure generate --clean --single-file -o allure-report allure-results
      - uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/index.html
          retention-days: 14

  # Mutation testing of the pure-logic modules — nightly or on demand, not per
  # PR: it re-runs the suite once per mutant. Thresholds live in each
  # module's .gremlins.yaml; a drop below them fails the job.
  mutation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: [libs/resilient-http-client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.versions.outputs.GO_VERSION }}
      - run: go install "github.com/go-gremlins/gremlins/cmd/gremlins@v${{ needs.versions.outputs.GREMLINS_VERSION }}"
      - working-directory: ${{ matrix.module }}
        env:
          GOFLAGS: -count=1 # timeout is derived from the coverage run; never let it hit the cache
        run: gremlins unleash --output "$GITHUB_WORKSPACE/gremlins-$(basename "${{ matrix.module }}").json" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gremlins-${{ hashFiles(format('{0}/go.mod', matrix.module)) }}
          path: gremlins-*.json
          retention-days: 14

  # Dependency-free subset (ping + heartbeat); the GitLab job runs the full
  # suite with E2E_WITH_DEPS=1 against real Postgres / Valkey / Kafka services.
  e2e:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COREPACK_NPM_REGISTRY: ${{ vars.COREPACK_NPM_REGISTRY }}
      npm_config_registry: ${{ vars.NPM_REGISTRY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.versions.outputs.GO_VERSION }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.versions.outputs.NODE_VERSION }}
          cache: pnpm
      # Cover-instrumented binaries: the e2e layer contributes to the merged
      # coverage through GOCOVERDIR, and Playwright reports to Allure like
      # every other layer.
      - name: build service binaries (cover-instrumented)
        env:
          VERSION: ${{ github.sha }}
          COVER: "1"
        run: |
          for s in ping heartbeat; do scripts/build-service.sh "$s"; done
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: playwright e2e
        env:
          GOCOVERDIR: ${{ github.workspace }}/.cover/e2e
          ALLURE_RESULTS_DIR: ${{ github.workspace }}/allure-results
        run: |
          mkdir -p "$GOCOVERDIR"
          pnpm --filter @golang-basics/e2e test
      - uses: actions/upload-artifact@v4
        with:
          name: cover-e2e
          path: .cover/e2e
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('allure-results/**') != ''
        with:
          name: allure-results-e2e
          path: allure-results
          retention-days: 7

  # Final status check for branch protection — the one required check.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [fmt, lint-test, integration, e2e, coverage]
    if: always()
    steps:
      - name: verify all jobs passed
        run: |
          for r in "${{ needs.fmt.result }}" "${{ needs.lint-test.result }}" \
                   "${{ needs.integration.result }}" "${{ needs.e2e.result }}" "${{ needs.coverage.result }}"; do
            [ "$r" = "success" ] || { echo "a required job did not succeed ($r)"; exit 1; }
          done
          echo "CI gate passed"
