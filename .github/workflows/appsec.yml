name: appsec

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for gitleaks
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  sast:
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep ci --config p/owasp-top-ten --config p/golang
        env:
          SEMGREP_RULES: ""

  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # google/osv-scanner-action is a reusable workflow, not a step action, so
      # install the pinned scanner binary directly and run it.
      - run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.3.8
      - run: osv-scanner scan --config=osv-scanner.toml --recursive .

  govulncheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [libs/httpx, libs/resilient-http-client, services/ping, services/heartbeat]
    steps:
      - uses: actions/checkout@v4
      - name: read pinned Go version from mise.toml
        run: echo "GO_VERSION=$(sed -n 's/^go[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' mise.toml)" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  hadolint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile: [services/ping/Dockerfile, services/heartbeat/Dockerfile]
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          config: .hadolint.yaml
          failure-threshold: error # the action's default ("info") overrides the config; pin it
