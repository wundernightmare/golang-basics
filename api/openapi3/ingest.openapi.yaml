openapi: 3.0.0
info:
  title: Ingest
  version: 1.0.0
  description: |-
    Ingest — the HTTP contract of services/ingest.

    One operation: a client hands over a batch of events and gets an answer
    only once every event of the batch is durable in at least one of the two
    sinks (Kafka, the S3 archive). The answer is all-or-nothing; anything but
    200 means "send the same batch again" — the event ids make that safe.

    Errors are RFC 9457 problem details (application/problem+json).
tags: []
paths:
  /events:
    post:
      operationId: IngestOps_ingest
      description: |-
        Accept a batch of events.

        200 — every event is durable in Kafka or in the archive (usually both).
        400 — the body is not the documented shape; do not retry it unchanged.
        413 — the body, or one event, is larger than the service accepts.
        429 — the service is holding as much unconfirmed data as it may; retry.
        503 — neither sink confirmed the batch; retry.

        A retry may store an event twice (the first attempt may have succeeded
        before its answer was lost): consumers deduplicate by event id.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '400':
          description: A problem response with the given status and content type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: A problem response with the given status and content type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: A problem the client answers by sending the same batch again, later.
          headers:
            Retry-After:
              required: true
              description: Seconds to wait before the retry.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: A problem the client answers by sending the same batch again, later.
          headers:
            Retry-After:
              required: true
              description: Seconds to wait before the retry.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRequest'
components:
  schemas:
    Event:
      type: object
      required:
        - id
        - payload
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
          description: |-
            Client-generated unique id (UUIDv7 recommended), assigned once and kept
            across retries: it is the deduplication key everywhere downstream — the
            archive compaction, the Kafka consumers, a replay.
        type:
          type: string
          pattern: ^[a-z0-9._-]{1,64}$
          description: Optional event type, e.g. "page.viewed"; travels as the event_type record header.
        payload:
          type: object
          additionalProperties: {}
          description: 'The event itself: any JSON object. Opaque to the service.'
      description: One event, stored and published byte for byte as it was sent.
      additionalProperties: false
    IngestRequest:
      type: object
      required:
        - events
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
          minItems: 1
          maxItems: 1000
          description: |-
            The batch. A client should collect events and send them together: while
            Kafka is unavailable an answer waits for the next archive flush, so one
            event per request means one event per flush interval.
      description: Body of POST /events.
      additionalProperties: false
    IngestResponse:
      type: object
      required:
        - accepted
      properties:
        accepted:
          type: integer
          format: int32
          minimum: 1
          description: Number of events accepted — the size of the batch sent.
      description: 'Body of a 200: every event of the request is durable.'
    Problem:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          description: URI reference identifying the problem type; "about:blank" when generic.
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: HTTP status of this occurrence — always equals the response status.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: URI reference identifying this occurrence (the request path).
        code:
          type: string
          description: Stable machine-readable code (e.g. invalid_event, overloaded, no_sink_available).
        request_id:
          type: string
          description: |-
            The request's correlation id — the same value as the X-Request-Id
            response header and the request_id field of the service's log lines.
      description: RFC 9457 problem details. Extension members are inlined (RFC 9457 §3.2).
servers:
  - url: http://localhost:8084
    description: local
    variables: {}
