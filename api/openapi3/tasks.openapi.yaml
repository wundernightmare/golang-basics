openapi: 3.0.0
info:
  title: Tasks
  version: 1.0.0
  description: |-
    Tasks — the HTTP contract of services/tasks.

    This file is the source of truth: the OpenAPI document (api/openapi3), the Go
    request/response types (libs/contracts/tasksapi) and the response validation
    in the tests are generated from it. Change the contract here, run
    `just contracts`, and the compiler tells you which handler no longer fits.

    Errors are RFC 9457 problem details (application/problem+json); every error
    response is a `Problem`, and business errors carry a stable `code`.
tags: []
paths:
  /tasks:
    post:
      operationId: TasksOps_create
      description: Create a task. Publishes a `task.created` event (see events.tsp) best-effort.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: A problem response with the given status and content type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
    get:
      operationId: TasksOps_list
      description: List tasks, newest first.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
  /tasks/{id}:
    get:
      operationId: TasksOps_get
      description: 'Fetch one task; served from the cache when warm (X-Cache: hit|miss).'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          headers:
            X-Cache:
              required: false
              schema:
                type: string
                enum:
                  - hit
                  - miss
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: A problem response with the given status and content type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      operationId: TasksOps_delete
      description: Delete a task and evict its cache entry.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '404':
          description: A problem response with the given status and content type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    CreateTaskRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          pattern: ^[^\u0000]+$
          description: |-
            Title of the task. Empty, or containing NUL, is rejected with a 400
            problem — the pattern states what the store can hold, so a generated
            schema-compliant request is always accepted (found by Schemathesis).
      description: Body of POST /tasks.
    Problem:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          description: URI reference identifying the problem type; "about:blank" when generic.
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: HTTP status of this occurrence — always equals the response status.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: URI reference identifying this occurrence (the request path).
        code:
          type: string
          description: Stable machine-readable code for business errors (e.g. task_not_found).
      description: RFC 9457 problem details. Extension members are inlined (RFC 9457 §3.2).
    Task:
      type: object
      required:
        - id
        - title
        - done
        - created_at
      properties:
        id:
          type: string
          description: Server-assigned identifier (UUID).
        title:
          type: string
          minLength: 1
          pattern: ^[^\u0000]+$
          description: Human-readable title; never empty, never containing NUL (PostgreSQL TEXT rejects it).
        done:
          type: boolean
          description: Completion flag.
        created_at:
          type: string
          format: date-time
          description: Creation time, RFC 3339 UTC.
      description: A single to-do item.
    TaskList:
      type: object
      required:
        - tasks
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
      description: 'Body of GET /tasks: newest first, at most 100 entries.'
servers:
  - url: http://localhost:8082
    description: local
    variables: {}
