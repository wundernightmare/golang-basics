# gremlins — mutation testing for the pure decision logic of this module.
#
#   just mutate                      # this module (default)
#   just mutate libs/resilient-http-client
#
# Scope: breaker.go (state machine), backoff.go (jitter, Retry-After parsing,
# idempotency and retryable-status rules), budget.go + window.go (retry
# budget, sliding window) and validate.go (config validation) — logic unit
# tests pin down exactly, with a fake clock. Everything else is excluded on
# purpose: the client, transport, bulkhead, config loading, errors and
# metrics are integration-shaped (httptest, timers, a real transport), where
# a surviving mutant is mostly noise and the run is slow.
#
# Run it with GOFLAGS=-count=1 (`just mutate` does): the per-mutant timeout is
# derived from the initial coverage run, so a cached run makes everything
# TIMED OUT.
#
# Thresholds fail the run (exit 1) when the suite lets too many mutants live.
# Efficacy = killed / (killed + lived); mutant coverage = mutants any test
# reaches. Ratchet them up when the numbers improve, never down without a
# reason in the commit message.
unleash:
  workers: 4
  timeout-coefficient: 3
  output-statuses: lt # print only LIVED and TIMED OUT — the ones that matter
  exclude-files:
    - "client\\.go$"
    - "transport\\.go$"
    - "bulkhead\\.go$"
    - "config\\.go$"
    - "errors\\.go$"
    - "metrics\\.go$"
    - "doc\\.go$"
  threshold:
    efficacy: 80
    mutant-coverage: 90
