openapi: 3.0.0
info:
  title: Notes
  version: 1.0.0
paths:
  /notes/{id}:
    get:
      operationId: getNote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
components:
  schemas:
    Note:
      type: object
      required:
        - id
        - written_at
      properties:
        id:
          type: string
        written_at:
          type: string
          format: date-time
