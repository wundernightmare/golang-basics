// The wire contract of credential.Codec. The Go codec is written against
// protowire (no generated code, no reflection); credential_test.go proves it
// byte-compatible with the reference implementation for this schema.
syntax = "proto3";

package tiercache.credential.v1;

message Credential {
  string id = 1;
  string crm_id = 2;
  string key_encrypted = 3;
}
