# gremlins — mutation testing of what in libs/otelx is logic rather than
# wiring: the head sampler (sampler.go) and the retroactive sampling buffer
# (retro/: the rings, the codec, the processor). A survivor there is a span
# lost, exported twice or read back wrong.
#
#   just mutate libs/otelx
#
# Run it through scripts/mutate.sh (`just mutate` and CI do), never bare: see
# the script for why a bare `gremlins unleash` reports every mutant killed.
# The oracle is the unit layer (`-short`).
#
# Excluded: otelx.go and config.go — the exporter, the resource and the
# provider are assembled there. What proves that wiring is exporter_test.go
# (Init against an httptest collector: TLS, headers, queue and batch sizes,
# the ambient environment, shutdown), the contract test and
# libs/otelx/integration (a real collector), not a unit assertion per line.
#
# Known survivors:
#   - retro/arena.go, the two bounds checks of shard.header: equivalent —
#     either one mutated leaves the other to refuse the same record; they
#     are there for a ring that is no longer made of records.
#   - retro/codec.go, the reader's bounds in take, count and string:
#     equivalent — the mutants refuse a read of exactly the bytes left, and
#     no record ends in such a read (the last four fields are varints).
#   - retro/codec.go, reader.number, `v > MaxInt32` → `>=`: not equivalent,
#     unreachable in practice — the mutant refuses the one value MaxInt32,
#     a count of dropped attributes or child spans no span has.
#
# Outside the efficacy (killed against lived), checked by hand:
#   - TIMED OUT: the mutants of the ring arithmetic in retro/arena.go that
#     make a loop over the records endless.
#   - NOT COVERED although the line is covered: gremlins does not mutate
#     a `case` expression of a tagless switch — the trigger rate limit
#     (`count >= limit` in arena.go) is one. Mutated by hand it is killed
#     by TestArena_TheRateLimitRefusesTriggersAboveItsSecond and the
#     trigger-budget tests above it. The other NOT COVERED are constant
#     expressions: the header layout and the window mask of arena.go, and
#     the dictionary quotas of codec.go (valuesMax, namesMax), which
#     TestCodec_AFullDictionaryFallsBackToText pins.
#
# Thresholds fail the run (exit 11) when the suite lets too many mutants live.
# Ratchet them up when the numbers improve, never down without a reason in
# the commit message.
unleash:
  workers: 4
  timeout-coefficient: 8
  output-statuses: lt # print only LIVED and TIMED OUT — the ones that matter
  exclude-files:
    - "doc\\.go$"
    - "^otelx\\.go$"
    - "^config\\.go$"
  threshold:
    efficacy: 90
    mutant-coverage: 90
