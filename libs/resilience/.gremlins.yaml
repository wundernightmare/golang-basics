# gremlins — mutation testing of the breaker, the sliding window and the
# retry budget: pure logic, pinned down by unit tests with a fake clock.
#
#   just mutate libs/resilience
#
# Run it through scripts/mutate.sh (`just mutate` and CI do), never bare: see
# the script for why a bare `gremlins unleash` reports every mutant killed.
#
# Thresholds fail the run (exit 11) when the suite lets too many mutants live.
# Efficacy = killed / (killed + lived); mutant coverage = mutants any test
# reaches. Ratchet them up when the numbers improve, never down without a
# reason in the commit message.
# Known survivors, equivalent — anything else is a gap:
#   backoff.go  Jitter: spread <= 0  (a spread of 0 adds rand.Int64N(1) = 0)
#   backoff.go  Jitter: ttl + …      (the spread is symmetric around 0)
# TIMED OUT is a kill here: a mutated loop condition in Backoff (delay > 0,
# delay < maxDelay) no longer stops at 0 or at the cap and counts to the
# attempt number, which the edge-input test sets to math.MaxInt.
unleash:
  workers: 4
  timeout-coefficient: 8
  output-statuses: lt # print only LIVED and TIMED OUT — the ones that matter
  exclude-files:
    - "doc\\.go$"
  threshold:
    efficacy: 90
    mutant-coverage: 90
