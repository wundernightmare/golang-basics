# golangci-lint configuration (v2 schema).
#
# Driven by `just lint` (per-module `golangci-lint run`) and `just fmt`
# (`golangci-lint fmt`). The linter set is the rough analogue of the Rust
# sibling repo's clippy gate (`-D warnings -D pedantic -D perf -D suspicious`):
# correctness + style + a few opinionated checks, without being so strict it
# blocks routine code.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard # govet, ineffassign, staticcheck, unused, errcheck
  enable:
    - bodyclose      # HTTP response bodies must be closed
    - errorlint      # correct errors.Is/As usage
    - gocritic       # opinionated correctness/perf/style diagnostics
    - gosec          # security-focused checks (the SAST-ish layer)
    - misspell       # spelling in comments/strings
    - nilerr         # `return nil` after a non-nil error
    - revive         # configurable style lint (golint successor)
    - unconvert      # redundant type conversions
    - unparam        # unused function parameters
    # Test hygiene — what the README "Tests" rules say, checked mechanically:
    - testifylint    # correct testify usage (require vs assert, Error vs ErrorIs, expected/actual order)
    - thelper        # helpers call t.Helper() first and take t as the first parameter
    - tparallel      # t.Parallel used consistently between a test and its sub-tests
    - usetesting     # t.Context / t.TempDir / t.Setenv instead of the os/context equivalents

  settings:
    revive:
      rules:
        - name: exported          # exported symbols need doc comments
        - name: indent-error-flow
        - name: unexported-return
    gosec:
      excludes:
        - G114 # http.ListenAndServe without timeouts — Server is built with timeouts in httpx
    thelper:
      tb:
        name: false # helpers take `t testing.TB` (not `tb`) so testify calls read the same as in tests
    testifylint:
      disable:
        - float-compare # metric values are integral counts carried as float64; exact Equal is the intent

  exclusions:
    generated: lax
    rules:
      # Test files: relax doc-comment and security noise.
      - path: _test\.go
        linters:
          - revive
          - gosec
          - unparam
      # testx.T is a struct (testo.T + the Allure plugin), not *testing.T; thelper
      # only recognises the stdlib types, so it is not applied where the handle
      # is testx.T.
      - path: _test\.go
        linters: [thelper]
        text: "testx\\.T"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/tracehubmmp/golang-basics
