# The application stack — tasks + consumer — wired to the backing services from
# docker/deps.yml. This is the in-container counterpart to running the binaries
# on the host: it proves the production images talk to real Postgres, Valkey and
# Kafka over a shared network.
#
# Usage (from the master worktree root):
#   just stack-up      # brings deps up, then builds + runs the app images
#   just stack-down    # tears everything (app + deps + volumes) down
#
# The app containers reach the broker at redpanda:29092 (the INTERNAL listener), and
# Postgres/Valkey by their compose service names — see docker/deps.yml.

name: golang-basics-stack

services:
  tasks:
    build:
      context: ..
      dockerfile: services/tasks/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    image: golang-basics-tasks:dev
    container_name: golang-basics-tasks
    restart: on-failure
    environment:
      TASKS_HTTP_ADDR: ":8082"
      TASKS_ADMIN_ADDR: ":9082"
      TASKS_DATABASE_URL: postgres://app:app@postgres:5432/app?sslmode=disable
      TASKS_VALKEY_URL: valkey://valkey:6379
      TASKS_KAFKA_BROKERS: redpanda:29092
      TASKS_KAFKA_TOPIC: tasks.events
      TASKS_LOG_FORMAT: json
    ports:
      - "8082:8082"
      - "9082:9082" # admin: health / metrics / version / pprof
    networks:
      - deps

  consumer:
    build:
      context: ..
      dockerfile: services/consumer/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    image: golang-basics-consumer:dev
    container_name: golang-basics-consumer
    restart: on-failure
    environment:
      CONSUMER_ADMIN_ADDR: ":9083"
      CONSUMER_KAFKA_BROKERS: redpanda:29092
      CONSUMER_KAFKA_TOPIC: tasks.events
      CONSUMER_KAFKA_GROUP: tasks-consumer
      CONSUMER_LOG_FORMAT: json
    ports:
      - "9083:9083" # admin: health / metrics / version / pprof
    networks:
      - deps

networks:
  # The network docker/deps.yml creates (compose names it "<project>_default").
  deps:
    name: golang-basics-deps_default
    external: true
