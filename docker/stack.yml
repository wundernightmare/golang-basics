# The application stack — ping, heartbeat, tasks and consumer from the one
# image recipe (docker/service.Dockerfile), wired to the backing services of
# docker/deps.yml. The in-container counterpart to running the binaries on
# the host: it proves the production images start, get ready and talk to real
# Postgres, Valkey and Kafka over a shared network.
#
# Usage (from the master worktree root):
#   just stack-up      # deps up --wait, then build + run these images, --wait
#   just stack-down    # tear everything (app + deps + volumes) down
#
# Build arguments come from the environment — `just stack-up` exports them:
#   GO_VERSION   required, the mise.toml pin (scripts/mise-pins.sh)
#   VERSION / GIT_SHA / BUILD_TIME   stamped into /version and build_info
#   DOCKER_HUB / GCR / GOPROXY / …   closed-network knobs (.env.example);
#                unset ones are simply not passed
#
# Readiness: the images are distroless (no shell, no curl), so they carry no
# HEALTHCHECK. The `ready` probe container below polls every service's
# /readyz on its admin port and is healthy only when all of them are, which
# is what `docker compose up --wait` blocks on.
#
# Every published port binds 127.0.0.1 only. The admin listeners bind 0.0.0.0
# inside the container (other containers scrape them), which httpx refuses
# without a token unless *_ADMIN_INSECURE=true — fine here, never in prod
# (set *_ADMIN_TOKEN there).
#
# Containers reach the broker at redpanda:29092 (the INTERNAL listener), and
# Postgres/Valkey by their compose service names — see docker/deps.yml.

name: golang-basics-stack

x-build: &build
  context: ..
  dockerfile: docker/service.Dockerfile
  args: &build-args
    GO_VERSION: ${GO_VERSION:-}
    VERSION: ${VERSION:-dev}
    GIT_SHA: ${GIT_SHA:-}
    BUILD_TIME: ${BUILD_TIME:-}
    DOCKER_HUB: ${DOCKER_HUB:-docker.io}
    GCR: ${GCR:-gcr.io}
    GOPROXY: ${GOPROXY:-}
    GOSUMDB: ${GOSUMDB:-}
    GONOSUMDB: ${GONOSUMDB:-}
    GOFLAGS: ${GOFLAGS:-}

# Local-only runtime defaults shared by every service (prefix added per service).
x-common: &common
  restart: on-failure
  networks: [deps]

services:
  ping:
    <<: *common
    build:
      <<: *build
      args:
        <<: *build-args
        SERVICE: ping
    image: golang-basics-ping:dev
    container_name: golang-basics-ping
    environment:
      PING_HTTP_ADDR: ":8080"
      PING_ADMIN_ADDR: ":9080"
      PING_ADMIN_INSECURE: "true"
      PING_HTTP_SHUTDOWN_DELAY: "0s"
      PING_LOG_FORMAT: json
      PING_OTEL_SERVICE_NAME: ping
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9080:9080" # admin: health / metrics / version / pprof

  heartbeat:
    <<: *common
    build:
      <<: *build
      args:
        <<: *build-args
        SERVICE: heartbeat
    image: golang-basics-heartbeat:dev
    container_name: golang-basics-heartbeat
    environment:
      HEARTBEAT_ADMIN_ADDR: ":9081"
      HEARTBEAT_ADMIN_INSECURE: "true"
      HEARTBEAT_HTTP_SHUTDOWN_DELAY: "0s"
      HEARTBEAT_LOG_FORMAT: json
      HEARTBEAT_OTEL_SERVICE_NAME: heartbeat
    ports:
      - "127.0.0.1:9081:9081" # admin

  tasks:
    <<: *common
    build:
      <<: *build
      args:
        <<: *build-args
        SERVICE: tasks
    image: golang-basics-tasks:dev
    container_name: golang-basics-tasks
    environment:
      TASKS_HTTP_ADDR: ":8082"
      TASKS_ADMIN_ADDR: ":9082"
      TASKS_ADMIN_INSECURE: "true"
      TASKS_HTTP_SHUTDOWN_DELAY: "0s"
      TASKS_DATABASE_URL: postgres://app:app@postgres:5432/app?sslmode=disable
      TASKS_VALKEY_URL: valkey://valkey:6379
      TASKS_KAFKA_BROKERS: redpanda:29092
      TASKS_KAFKA_TOPIC: tasks.events
      TASKS_KAFKA_ALLOW_AUTO_TOPIC_CREATION: "true"
      TASKS_LOG_FORMAT: json
      TASKS_OTEL_SERVICE_NAME: tasks
    ports:
      - "127.0.0.1:8082:8082"
      - "127.0.0.1:9082:9082" # admin

  consumer:
    <<: *common
    build:
      <<: *build
      args:
        <<: *build-args
        SERVICE: consumer
    image: golang-basics-consumer:dev
    container_name: golang-basics-consumer
    environment:
      CONSUMER_ADMIN_ADDR: ":9083"
      CONSUMER_ADMIN_INSECURE: "true"
      CONSUMER_HTTP_SHUTDOWN_DELAY: "0s"
      CONSUMER_KAFKA_BROKERS: redpanda:29092
      CONSUMER_KAFKA_TOPIC: tasks.events
      CONSUMER_KAFKA_GROUP: tasks-consumer
      CONSUMER_KAFKA_ALLOW_AUTO_TOPIC_CREATION: "true"
      CONSUMER_LOG_FORMAT: json
      CONSUMER_OTEL_SERVICE_NAME: consumer
    ports:
      - "127.0.0.1:9083:9083" # admin

  # Readiness gate for `up --wait`: healthy once all four /readyz answer 200.
  ready:
    image: ${DOCKER_HUB:-docker.io}/library/busybox:1.37
    container_name: golang-basics-stack-ready
    command: ["sleep", "infinity"]
    networks: [deps]
    depends_on: [ping, heartbeat, tasks, consumer]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://ping:9080/readyz &&
          wget -q -O /dev/null http://heartbeat:9081/readyz &&
          wget -q -O /dev/null http://tasks:9082/readyz &&
          wget -q -O /dev/null http://consumer:9083/readyz
      interval: 2s
      timeout: 5s
      retries: 60

networks:
  # The network docker/deps.yml creates (compose names it "<project>_default").
  deps:
    name: golang-basics-deps_default
    external: true
