# VictoriaMetrics scrape config (Prometheus format).
#
# Every service exposes /metrics on its *admin* listener (libs/httpx: :9080 for
# ping, :9081 heartbeat, :9082 tasks, :9083 consumer — API port + 1000), never
# on the API port, so there is one job per service with two targets: the
# container (running under `just stack-up`) and the host (running under
# `just up`, or a binary you started from VS Code's debugger). Only one of the
# two is normally alive; the other just reports as down. The `service` label
# is what the dashboard and the trace ⇄ metrics links key on.

global:
  scrape_interval: 10s
  scrape_timeout: 5s
  external_labels:
    stack: golang-basics

scrape_configs:
  - job_name: ping
    static_configs:
      - targets: ["ping:9080", "host.docker.internal:9080"]
        labels: { service: ping }

  - job_name: heartbeat
    static_configs:
      - targets: ["heartbeat:9081", "host.docker.internal:9081"]
        labels: { service: heartbeat }

  - job_name: tasks
    static_configs:
      - targets: ["tasks:9082", "host.docker.internal:9082"]
        labels: { service: tasks }

  - job_name: consumer
    static_configs:
      - targets: ["consumer:9083", "host.docker.internal:9083"]
        labels: { service: consumer }

  # ── dependencies ──────────────────────────────────────────────────────────
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels: { service: postgres }

  - job_name: valkey
    static_configs:
      - targets: ["valkey-exporter:9121"]
        labels: { service: valkey }

  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]
        labels: { service: redpanda }

  # ── the pipeline itself ───────────────────────────────────────────────────
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
        labels: { service: otel-collector }
