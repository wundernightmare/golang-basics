# Starter alert rules for vmalert (Prometheus rule format), evaluated against
# VictoriaMetrics by the `vmalert` service in docker/observability.yml.
#
# A starting point, not an SLO policy: thresholds are deliberately round and
# `for:` windows short enough to see them fire locally. Copy into the
# platform's rule repo and tune there. Every expression keys on the `service`
# label the scrape config adds (observability/scrape.yml).
#
#   UI: http://localhost:8880  (vmalert) — or `ALERTS` in Grafana/Explore.

groups:
  - name: golang-basics-http
    rules:
      # RED: share of API responses that are 5xx, per service.
      - alert: HighErrorRatio
        expr: |
          sum by (service) (rate(http_requests_total{status=~"5.."}[5m]))
            / sum by (service) (rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.service }}: {{ $value | humanizePercentage }} of requests are 5xx"

      # RED: p99 latency per route (classic buckets; the native histogram
      # carries the same data for backends that read it).
      - alert: HighP99Latency
        expr: |
          histogram_quantile(0.99,
            sum by (service, route, le) (rate(http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "{{ $labels.service }} {{ $labels.route }}: p99 {{ $value | humanizeDuration }}"

      # A handler panicked (recovered, answered 500): a bug, not load.
      - alert: HttpUnhandledErrors
        expr: sum by (service) (increase(http_unhandled_errors_total[5m])) > 0
        for: 0m
        labels: { severity: ticket }
        annotations:
          summary: "{{ $labels.service }}: {{ $value }} unhandled errors (panics) in 5m"

  - name: golang-basics-health
    rules:
      # Scrape target down: the process (or its admin listener) is gone.
      - alert: ServiceDown
        # No scrapeable target left for the service. One replica (or the
        # host/container target you are not running locally) being down is
        # not a page; every one of them gone is.
        expr: max by (service) (up{service=~"ping|heartbeat|tasks|consumer"}) == 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.service }}: no scrapeable instance"
      - alert: ReadinessCheckFailing
        expr: health_check_up{critical="true"} == 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.service }}: critical readiness check {{ $labels.check }} failing"

      - alert: OptionalDependencyDegraded
        expr: health_check_up{critical="false"} == 0
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "{{ $labels.service }}: optional dependency {{ $labels.check }} down (serving degraded)"

  - name: golang-basics-data
    rules:
      # Consumer-group lag, from the broker (Redpanda /public_metrics with
      # enable_consumer_group_metrics, docker/deps.yml; kafka-exporter or
      # Burrow on Kafka). The services do not export lag: the broker sees
      # every group and partition once, also while no member is running.
      - alert: KafkaConsumerLagHigh
        expr: max by (redpanda_group) (redpanda_kafka_consumer_group_lag_sum) > 1000
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "consumer group {{ $labels.redpanda_group }}: {{ $value }} records behind"

      # Records the consumer gave up on and parked on the dead-letter topic.
      - alert: KafkaDeadLettering
        expr: sum by (service, topic) (rate(kafka_consumer_records_total{result="dead_lettered"}[5m])) > 0
        for: 1m
        labels: { severity: ticket }
        annotations:
          summary: "{{ $labels.service }}: records from {{ $labels.topic }} are being dead-lettered"

      # Transactional outbox: the oldest event not yet published. A backlog
      # that moves is fine; one stuck for minutes means Kafka is unreachable
      # (or not configured — the gauge is exported either way) or the relay
      # is stuck. Every app metric name in this file and the dashboard is
      # checked against a live /metrics by the e2e suite (e2e/tasks_test.go).
      - alert: OutboxStuck
        expr: max by (service) (outbox_oldest_age_seconds) > 60
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: "{{ $labels.service }}: oldest outbox event is {{ $value | humanizeDuration }} old"

      # A dead outbox row: the broker rejected the event OUTBOX_MAX_ATTEMPTS
      # times and the relay gave up on it. It will never be sent on its own —
      # someone has to fix and re-arm it (services/tasks README, "Outbox").
      - alert: OutboxDeadEvents
        expr: max by (service) (outbox_dead) > 0
        for: 1m
        labels: { severity: ticket }
        annotations:
          summary: "{{ $labels.service }}: {{ $value }} outbox events dead (rejected by the broker)"

      # Postgres pool saturation: connections in use vs the configured max.
      - alert: DbPoolSaturated
        expr: |
          sum by (service) (db_pool_connections{state="in_use"})
            / max by (service) (db_pool_max_connections) > 0.9
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: "{{ $labels.service }}: db pool {{ $value | humanizePercentage }} in use"

      # …and requests actually waiting for a connection (pgxpool only counts
      # this; nodejs-basics alerts on its pending-acquires gauge instead).
      - alert: DbPoolStarved
        expr: sum by (service) (rate(db_pool_acquires_waited_total[5m])) > 1
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: "{{ $labels.service }}: {{ $value }}/s acquires waited for a free connection"
