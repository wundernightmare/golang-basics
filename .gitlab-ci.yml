# GitLab CI — mirrors .github/workflows/{ci,appsec,docker}.yml.
#
# golang-basics is a go.work workspace; a workspace root is not itself a module,
# so the lint/test jobs fan out over each module (parallel:matrix), exactly like
# the GitHub matrices. Container-backed integration tests + Docker builds use a
# Docker-in-Docker service.
#
# Tool versions are NOT written here. The `versions` job parses mise.toml and
# publishes every pin as a dotenv artifact, so this file and `mise install`
# cannot drift — the same single-source-of-truth trick the GitHub `versions` job
# uses. Bump a version in mise.toml; nothing here changes.
#
# Cost model: the module + build cache is warmed once by `prepare` and pulled by
# everything else, tools ship as pinned images or as binaries built once in
# `prepare`, and `needs:` turns the stage list into a DAG so security and
# packaging do not queue behind the test matrix.
#
# Closed networks (self-hosted GitLab, no direct internet): every upstream this
# file touches is a variable with the public default — registry hosts
# (DOCKER_HUB / GHCR / GCR), GOPROXY, scanner databases, rule packs. Override
# them as group/project CI/CD variables (same names as .env.example); nothing
# here needs editing. No job installs packages with apt/curl — the one tarball
# fetch (Node for the allure-report job) comes from the NODE_DIST_URL variable.

workflow:
  rules:
    # One pipeline per change: MR pipelines for MRs, branch pipelines for the
    # default branch and tags. Without this a push to an MR branch runs twice.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule" # nightly: mutation testing

stages:
  - prepare
  - check
  - test
  - report
  - security
  - package

default:
  # A superseded pipeline is cancelled instead of burning runner minutes.
  interruptible: true
  timeout: 20m

variables:
  GOTOOLCHAIN: local
  # Determinism hygiene (see the GitHub workflow): fixed zone, shuffled order.
  TZ: UTC
  GOFLAGS: -shuffle=on
  # ── Closed-network knobs — defaults are the public upstreams ──────────────
  # Registry hosts, used as the prefix of every image:/services: below and
  # passed into `docker build`. Point at a pull-through cache (Harbor proxy
  # project, Nexus docker-proxy, or GitLab's own Dependency Proxy for Docker
  # Hub: $CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX).
  DOCKER_HUB: docker.io
  GHCR: ghcr.io
  GCR: gcr.io
  # Go module proxy / checksum db (GONOSUMDB, GOSUMDB) and the govulncheck
  # database (GOVULNDB) are plain environment variables the Go tools read —
  # set them at group level, no job references them by name. GOPROXY defaults
  # here so the value is visible and overridable in one place.
  GOPROXY: https://proxy.golang.org,direct
  # Scanner inputs. SEMGREP_CONFIG: space-separated packs or a directory of
  # vendored rules. OSV_SCANNER_FLAGS: e.g. "--offline --local-db-path /srv/osv".
  # GRYPE_DB_UPDATE_URL / GRYPE_DB_AUTO_UPDATE are forwarded to grype when set.
  SEMGREP_CONFIG: p/owasp-top-ten p/golang
  OSV_SCANNER_FLAGS: ""
  # testcontainers (integration job) prefixes Docker Hub images with this.
  TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ""
  # Node tarballs for the allure-report job (a JRE image + Node).
  NODE_DIST_URL: https://nodejs.org/dist
  # GitLab only caches paths inside the project directory, so the Go caches are
  # relocated there rather than left in $HOME.
  GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build
  MODULES: >-
    libs/contracts libs/httpx libs/testx libs/resilient-http-client libs/pgx
    libs/valkey libs/kafka libs/otelx services/ping services/heartbeat
    services/tasks services/consumer

# ── Reusable fragments ────────────────────────────────────────────────────────

.cache-pull: &cache-pull
  key:
    files: [go.work.sum]
    prefix: go
  paths:
    - .cache/go-mod
    - .cache/go-build
  policy: pull

# Go jobs: pinned image from mise.toml, warm cache, tools from `prepare` on PATH.
.go:
  image: ${DOCKER_HUB}/library/golang:${GO_VERSION}-bookworm
  needs:
    - job: versions
      artifacts: true
    - job: prepare
      artifacts: true
  cache: *cache-pull
  before_script:
    - export PATH="$CI_PROJECT_DIR/bin:$PATH"

# Skip the Go pipeline on docs-only merge requests; always run on the default
# branch so nothing merges unverified.
.rules-go:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*.go"
        - "**/go.mod"
        - "**/go.sum"
        - go.work
        - go.work.sum
        - .golangci.yml
        - .gitlab-ci.yml
        - mise.toml
        - scripts/**/*
        - e2e/**/*
        - api/**/*
        - pnpm-lock.yaml

.rules-docker:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*.go"
        - "**/Dockerfile"
        - .dockerignore
        - docker/**/*
        - .gitlab-ci.yml
        - mise.toml

.dind:
  services:
    - name: ${DOCKER_HUB}/library/docker:28-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

# ── prepare ───────────────────────────────────────────────────────────────────

# Single source of truth: every pin below is read out of mise.toml and published
# as a dotenv artifact, which downstream jobs consume as ordinary variables —
# including in `image:`. Nothing in this file hard-codes a tool version.
versions:
  stage: prepare
  image: ${DOCKER_HUB}/library/alpine:3.22
  script:
    # scripts/mise-pins.sh is shared with the GitHub `versions` job and exits
    # non-zero on a missing pin, so a typo in mise.toml fails here instead of
    # surfacing as a broken `image:` tag much later.
    - sh scripts/mise-pins.sh | tee versions.env
  artifacts:
    reports:
      dotenv: versions.env

# Warms the shared module + build cache once (instead of 25 cold downloads
# across the matrices) and builds the Go-based tools a single time, handing them
# to every later job as an artifact.
prepare:
  stage: prepare
  image: ${DOCKER_HUB}/library/golang:${GO_VERSION}-bookworm
  needs:
    - job: versions
      artifacts: true
  cache:
    <<: *cache-pull
    policy: pull-push
  script:
    - for m in $MODULES; do (cd "$m" && go mod download); done
    - mkdir -p bin
    - GOBIN="$CI_PROJECT_DIR/bin" go install "gotest.tools/gotestsum@v${GOTESTSUM_VERSION}"
    - GOBIN="$CI_PROJECT_DIR/bin" go install "github.com/boumenot/gocover-cobertura@v${COBERTURA_VERSION}"
    - GOBIN="$CI_PROJECT_DIR/bin" go install "golang.org/x/vuln/cmd/govulncheck@v${GOVULNCHECK_VERSION}"
    - GOBIN="$CI_PROJECT_DIR/bin" go install "github.com/vladopajic/go-test-coverage/v2@v${GOTESTCOV_VERSION}"
    - GOBIN="$CI_PROJECT_DIR/bin" go install "github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v${OAPICODEGEN_VERSION}"
    - GOBIN="$CI_PROJECT_DIR/bin" go install "github.com/atombender/go-jsonschema@v${GOJSONSCHEMA_VERSION}"
    - GOBIN="$CI_PROJECT_DIR/bin" go install "github.com/oasdiff/oasdiff@v${OASDIFF_VERSION}"
  artifacts:
    paths: [bin/]
    expire_in: 1 day

# ── check ─────────────────────────────────────────────────────────────────────

fmt:
  extends: [.go, .rules-go]
  stage: check
  script:
    # Scoped to the module trees: GOMODCACHE now lives under .cache/ so GitLab
    # can cache it, and a bare `gofmt -l .` walks into its test fixtures.
    - out="$(gofmt -l ./libs ./services)"; if [ -n "$out" ]; then echo "gofmt needed in:"; echo "$out"; exit 1; fi

# Contracts, step 1: the TypeSpec source compiles to exactly the committed
# OpenAPI / JSON Schema (node image; nothing to apt/curl).
contracts-tsp:
  extends: .rules-go
  stage: check
  image: ${DOCKER_HUB}/library/node:${NODE_VERSION}-bookworm
  needs:
    - job: versions
      artifacts: true
  before_script:
    - npm install -g corepack@latest && corepack enable
    - pnpm install --frozen-lockfile
  script:
    - pnpm --filter @golang-basics/api compile
    - git diff --exit-code --stat -- api/openapi3 api/jsonschema || { echo "contracts are stale — run 'just contracts' and commit"; exit 1; }

# Contracts, step 2: the Go types match the committed contracts, and the HTTP
# contract has no breaking change against the default branch (oasdiff).
contracts-go:
  extends: [.go, .rules-go]
  stage: check
  variables:
    GIT_DEPTH: 0
  script:
    - oapi-codegen -config api/oapi-codegen.yaml api/openapi3/tasks.openapi.yaml
    - |
      go-jsonschema -p events --only-models --schema-root-type TaskCreatedEvent=TaskCreatedEvent \
        -o libs/contracts/events/task_created.gen.go api/jsonschema/TaskCreatedEvent.json
    - (cd libs/contracts && gofmt -w . && go build ./...)
    - git diff --exit-code --stat -- libs/contracts || { echo "generated Go contracts are stale — run 'just contracts' and commit"; exit 1; }
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        git fetch --depth=1 origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        if git show "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME:api/openapi3/tasks.openapi.yaml" > /tmp/base.yaml 2>/dev/null; then
          oasdiff breaking /tmp/base.yaml api/openapi3/tasks.openapi.yaml --fail-on ERR --err-ignore api/oasdiff-breaking.ignore
        else
          echo "no base spec on the target branch — first version"
        fi
      fi

vet:
  extends: [.go, .rules-go]
  stage: check
  parallel:
    matrix:
      - MODULE:
          - libs/contracts
          - libs/httpx
          - libs/testx
          - libs/resilient-http-client
          - libs/pgx
          - libs/valkey
          - libs/kafka
          - libs/otelx
          - services/ping
          - services/heartbeat
          - services/tasks
          - services/consumer
  script:
    - cd "$MODULE"
    - go vet ./...

# golangci-lint ships its own image with a matching Go toolchain, which replaces
# the previous curl-install-per-matrix-job.
lint:
  extends: .rules-go
  stage: check
  image: ${DOCKER_HUB}/golangci/golangci-lint:v${GOLANGCI_VERSION}
  needs:
    - job: versions
      artifacts: true
    - job: prepare
      artifacts: true
  cache: *cache-pull
  parallel:
    matrix:
      - MODULE:
          - libs/contracts
          - libs/httpx
          - libs/testx
          - libs/resilient-http-client
          - libs/pgx
          - libs/valkey
          - libs/kafka
          - libs/otelx
          - services/ping
          - services/heartbeat
          - services/tasks
          - services/consumer
  script:
    - cd "$MODULE"
    - golangci-lint run

# ── test ──────────────────────────────────────────────────────────────────────

# Unit tests only — the container-backed suites run in `integration`. gotestsum
# emits JUnit so failures show up in the MR widget instead of only in the log,
# and the coverage profile feeds both the `coverage:` regex (the MR percentage)
# and Cobertura (per-line annotations in the diff).
unit:
  extends: [.go, .rules-go]
  stage: test
  parallel:
    matrix:
      - MODULE:
          - libs/contracts
          - libs/httpx
          - libs/testx
          - libs/resilient-http-client
          - libs/pgx
          - libs/valkey
          - libs/kafka
          - libs/otelx
          - services/ping
          - services/heartbeat
          - services/tasks
          - services/consumer
  variables:
    ALLURE_RESULTS_DIR: $CI_PROJECT_DIR/allure-results
  script:
    - mkdir -p "$CI_PROJECT_DIR/.cover/unit"
    - cd "$MODULE"
    # Text profile → Cobertura for the MR annotations; binary profile
    # (.cover/unit, every workspace package) → the covdata merge in `coverage`.
    - |
      gotestsum --junitfile junit.xml --format testname -- \
        -short -race -coverprofile=coverage.out -covermode=atomic \
        -coverpkg=github.com/tracehubmmp/golang-basics/... ./... \
        -args -test.gocoverdir="$CI_PROJECT_DIR/.cover/unit"
    - go tool cover -func=coverage.out | tail -1
    - gocover-cobertura < coverage.out > coverage.xml
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - .cover/unit/
      - allure-results/
    reports:
      junit: $MODULE/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: $MODULE/coverage.xml

# Container-backed integration tests (Postgres / Valkey / Kafka via
# testcontainers). GitLab already exports CI=true, which is what makes the
# suites fail — rather than skip — if a container cannot start; the host
# override points testcontainers at the dind service.
integration:
  extends: [.go, .dind, .rules-go]
  stage: test
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: docker
    TESTCONTAINERS_RYUK_DISABLED: "true"
    ALLURE_RESULTS_DIR: $CI_PROJECT_DIR/allure-results
  parallel:
    matrix:
      - MODULE: [libs/pgx, libs/valkey, libs/kafka, services/tasks, services/consumer]
  script:
    - mkdir -p "$CI_PROJECT_DIR/.cover/integration"
    - cd "$MODULE"
    - |
      gotestsum --junitfile junit.xml --format testname -- \
        -cover -covermode=atomic -coverpkg=github.com/tracehubmmp/golang-basics/... ./... \
        -args -test.gocoverdir="$CI_PROJECT_DIR/.cover/integration"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - .cover/integration/
      - allure-results/
    reports:
      junit: $MODULE/junit.xml

# ── report ────────────────────────────────────────────────────────────────────

# One coverage number for the whole pyramid: unit + integration + e2e layers
# covdata-merged and gated by .testcoverage.yml (`just cov-check`). The
# per-module Cobertura reports above give the MR its line annotations; this
# one decides pass/fail.
coverage:
  extends: [.go, .rules-go]
  stage: report
  needs:
    - job: versions
      artifacts: true
    - job: prepare
      artifacts: true
    - job: unit
      artifacts: true
    - job: integration
      artifacts: true
    - job: e2e
      artifacts: true
    # master's breakdown from its latest successful pipeline: a merge request
    # may not lower the merged coverage (diff threshold 0). Optional so the
    # very first pipeline, and one on a fresh fork, still run.
    - project: $CI_PROJECT_PATH
      ref: $CI_DEFAULT_BRANCH
      job: coverage
      artifacts: true
      optional: true
  script:
    - '[ -s coverage-breakdown.json ] && mv coverage-breakdown.json coverage-breakdown-base.json || true'
    - scripts/cover.sh merge
    - |
      if [ -s coverage-breakdown-base.json ] && [ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ]; then
        go-test-coverage --config .testcoverage.yml \
          --diff-base-breakdown-file-name coverage-breakdown-base.json --diff-threshold 0
      else
        go-test-coverage --config .testcoverage.yml
      fi
  artifacts:
    expire_in: 4 weeks # long enough to always have a base for MRs
    paths: [coverage-merged.out, coverage-breakdown.json]

# One Allure HTML report from every suite's results (unit + integration + e2e
# + schemathesis; the latter two optional, their jobs may be skipped).
# allure-commandline is a Node package (root package.json → npm mirror) that
# needs a JRE, and no pinned image ships both. The JRE image is the base and
# Node comes as a tarball from NODE_DIST_URL — a variable with the public
# default, mirror it like GOPROXY in a closed network (.env.example).
allure-report:
  extends: .rules-go
  stage: report
  image: ${DOCKER_HUB}/library/eclipse-temurin:25-jre
  needs:
    - job: versions
      artifacts: true
    - job: unit
      artifacts: true
    - job: integration
      artifacts: true
      optional: true
    - job: e2e
      artifacts: true
      optional: true
    - job: schemathesis
      artifacts: true
      optional: true
  variables:
    NODE_DIST: node-v${NODE_VERSION}-linux-x64
  before_script:
    # Node from its own tarball (NODE_DIST_URL for a mirror), then pnpm via corepack.
    - curl -fsSL "${NODE_DIST_URL}/v${NODE_VERSION}/${NODE_DIST}.tar.xz" | tar -xJ -C /opt
    - export PATH="/opt/${NODE_DIST}/bin:$PATH"
    - npm install -g corepack@latest && corepack enable
    - pnpm install --frozen-lockfile
  script:
    - test -d allure-results || { echo "no allure-results"; exit 0; }
    # categories.json + executor.json from the tracked file and the CI_* variables.
    - bash scripts/allure-meta.sh allure-results
    - pnpm exec allure generate --clean --single-file -o allure-report allure-results
  artifacts:
    expire_in: 2 weeks
    paths: [allure-report/]

# Flakiness hunt — nightly: every layer three times, shuffled, under -race.
stress:
  extends: .go
  stage: report
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  parallel:
    matrix:
      - MODULE:
          - libs/contracts
          - libs/httpx
          - libs/testx
          - libs/resilient-http-client
          - libs/otelx
          - services/ping
          - services/heartbeat
          - services/tasks
          - services/consumer
  script:
    - cd "$MODULE" && go test -short -count=3 -race -shuffle=on ./...

# Fuzzing — nightly: every Fuzz* target for a fixed budget (scripts/fuzz.sh).
fuzz:
  extends: .go
  stage: report
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  script:
    - FUZZTIME=45s scripts/fuzz.sh
  artifacts:
    when: on_failure
    expire_in: 2 weeks
    paths: ["**/testdata/fuzz/"]

# Micro-benchmarks — nightly: benchstat against the default branch's last run
# (its artifact), printed, informational.
bench:
  extends: .go
  stage: report
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  needs:
    - job: versions
      artifacts: true
    - job: prepare
      artifacts: true
    - project: $CI_PROJECT_PATH
      ref: $CI_DEFAULT_BRANCH
      job: bench
      artifacts: true
      optional: true
  script:
    - GOBIN="$CI_PROJECT_DIR/bin" go install "golang.org/x/perf/cmd/benchstat@v${BENCHSTAT_VERSION}"
    - '[ -s bench-head.txt ] && mv bench-head.txt bench-base.txt || true'
    - scripts/bench.sh bench-head.txt
    - '[ -s bench-base.txt ] && benchstat bench-base.txt bench-head.txt || benchstat bench-head.txt'
  artifacts:
    expire_in: 4 weeks
    paths: [bench-head.txt]

# Mutation testing of the pure-logic modules — on the nightly schedule or by
# hand, never per MR (one suite run per mutant). Thresholds: <module>/.gremlins.yaml.
mutation:
  extends: .go
  stage: report
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  parallel:
    matrix:
      - MODULE: [libs/resilient-http-client]
  script:
    - GOBIN="$CI_PROJECT_DIR/bin" go install "github.com/go-gremlins/gremlins/cmd/gremlins@v${GREMLINS_VERSION}"
    - cd "$MODULE" && GOFLAGS=-count=1 gremlins unleash --output "$CI_PROJECT_DIR/gremlins-$(basename "$MODULE").json"
  artifacts:
    when: always
    expire_in: 2 weeks
    paths: [gremlins-*.json]

# Service binaries for the e2e harness, built once on the pinned toolchain and
# handed over as an artifact so the e2e job needs no Go at all.
build-services:
  extends: [.go, .rules-go]
  stage: test
  variables:
    VERSION: $CI_COMMIT_SHORT_SHA
    COVER: "1" # cover-instrumented: the e2e layer feeds the merged coverage via GOCOVERDIR
  script:
    - for s in $(echo "$MODULES" | tr ' ' '\n' | grep '^services/' | cut -d/ -f2); do
        scripts/build-service.sh "$s";
      done
  artifacts:
    paths: [services/*/bin/]
    expire_in: 1 day

# The full suite with E2E_WITH_DEPS=1: ping + heartbeat plus tasks + consumer
# against real Postgres / Valkey / Redpanda — the same scope as the GitHub e2e
# job (which brings the deps up from docker/deps.yml), so the two pipelines
# prove the same thing.
#
# The backing services are GitLab `services:` (reachable by alias), not
# docker compose in dind — so the job runs from the plain node image with no
# apt/curl install step and nothing to fetch beyond the npm registry. The
# harness forwards its own environment to the services it spawns, which is how
# the *_URL / *_BROKERS variables below reach tasks and consumer.
e2e:
  extends: .rules-go
  stage: test
  image: ${DOCKER_HUB}/library/node:${NODE_VERSION}-bookworm
  needs:
    - job: versions
      artifacts: true
    - job: build-services
      artifacts: true
  services:
    - name: ${DOCKER_HUB}/library/postgres:18-alpine
      alias: postgres
    - name: ${DOCKER_HUB}/valkey/valkey:9.0
      alias: valkey
    - name: ${DOCKER_HUB}/redpandadata/redpanda:v26.1.1
      alias: redpanda
      command:
        - redpanda
        - start
        - --node-id=0
        - --check=false
        - --set
        - redpanda.auto_create_topics_enabled=true
        - --kafka-addr
        - 0.0.0.0:9092
        - --advertise-kafka-addr
        - redpanda:9092
        - --smp=1
        - --memory=1G
        - --reserve-memory=0M
        - --overprovisioned
  variables:
    POSTGRES_DB: app
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app
    E2E_WITH_DEPS: "1"
    TASKS_DATABASE_URL: postgres://app:app@postgres:5432/app?sslmode=disable
    TASKS_VALKEY_URL: valkey://valkey:6379
    TASKS_KAFKA_BROKERS: redpanda:9092
    CONSUMER_KAFKA_BROKERS: redpanda:9092
    # Health probes and metrics live on the admin ports (see e2e/helpers/env.ts).
    PING_ADMIN_URL: http://localhost:9080
    HEARTBEAT_ADMIN_URL: http://localhost:9081
    TASKS_ADMIN_URL: http://localhost:9082
    CONSUMER_ADMIN_URL: http://localhost:9083
    GOCOVERDIR: $CI_PROJECT_DIR/.cover/e2e
    ALLURE_RESULTS_DIR: $CI_PROJECT_DIR/allure-results
  before_script:
    # Node 26 no longer ships corepack; packageManager in package.json pins
    # pnpm. COREPACK_NPM_REGISTRY / npm_config_registry redirect both fetches.
    - npm install -g corepack@latest && corepack enable
  script:
    - mkdir -p "$GOCOVERDIR"
    - pnpm install --frozen-lockfile
    - cd e2e && pnpm test
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - e2e/playwright-report/
      - e2e/test-results/
      - .cover/e2e/
      - allure-results/

# Generative API testing: Schemathesis (its own pinned image, no Go inside —
# the binaries come from build-services) drives ping and tasks with requests
# generated from their OpenAPI documents; deps are services like in e2e.
schemathesis:
  extends: .rules-go
  stage: test
  image:
    name: ${DOCKER_HUB}/schemathesis/schemathesis:${SCHEMATHESIS_VERSION}
    entrypoint: [""]
  needs:
    - job: versions
      artifacts: true
    - job: build-services
      artifacts: true
  services:
    - name: ${DOCKER_HUB}/library/postgres:18-alpine
      alias: postgres
    - name: ${DOCKER_HUB}/valkey/valkey:9.0
      alias: valkey
    - name: ${DOCKER_HUB}/redpandadata/redpanda:v26.1.1
      alias: redpanda
      command:
        - redpanda
        - start
        - --node-id=0
        - --check=false
        - --set
        - redpanda.auto_create_topics_enabled=true
        - --kafka-addr
        - 0.0.0.0:9092
        - --advertise-kafka-addr
        - redpanda:9092
        - --smp=1
        - --memory=1G
        - --reserve-memory=0M
        - --overprovisioned
  variables:
    POSTGRES_DB: app
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app
    TASKS_DATABASE_URL: postgres://app:app@postgres:5432/app?sslmode=disable
    TASKS_VALKEY_URL: valkey://valkey:6379
    TASKS_KAFKA_BROKERS: redpanda:9092
    ALLURE_RESULTS_DIR: $CI_PROJECT_DIR/allure-results
  script:
    - SERVICE_BIN="$CI_PROJECT_DIR/services/ping/bin/ping" sh scripts/schemathesis.sh ping
    - SERVICE_BIN="$CI_PROJECT_DIR/services/tasks/bin/tasks" sh scripts/schemathesis.sh tasks
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - allure-results/

# ── security (AppSec) — mirrors appsec.yml ────────────────────────────────────
# These need neither the test matrix nor each other, so `needs: [versions]` lets
# them start as soon as the pins are known instead of waiting for `test`.

secret-detection:
  stage: security
  image:
    name: ${DOCKER_HUB}/zricethezav/gitleaks:v${GITLEAKS_VERSION}
    entrypoint: [""]
  needs:
    - job: versions
      artifacts: true
  script:
    - gitleaks detect --source . --config .gitleaks.toml --verbose

sast:
  stage: security
  image:
    name: ${DOCKER_HUB}/semgrep/semgrep:${SEMGREP_VERSION}
    entrypoint: [""]
  needs:
    - job: versions
      artifacts: true
  script:
    # `semgrep scan`, not `semgrep ci`: no call home to semgrep.dev, no metrics.
    - set -- ; for c in $SEMGREP_CONFIG; do set -- "$@" --config "$c"; done
    - semgrep scan "$@" --error --metrics=off

# osv-scanner ships an official image, which also avoids the `go install` that
# pinned it independently of mise.toml (and stuck on a version that panics on
# go1.27 SSA). The binary is the image entrypoint, cleared here so GitLab can
# run its shell wrapper — hence the absolute path.
#
# Call analysis is off: the image bundles go1.26, go.work requires >= 1.27, and
# GOTOOLCHAIN=local forbids fetching a newer one, so it errors out. Reachability
# is covered anyway by the dedicated `govulncheck` matrix below, which runs on
# the pinned toolchain.
dependency-scanning:
  stage: security
  image:
    name: ${GHCR}/google/osv-scanner:v${OSV_VERSION}
    entrypoint: [""]
  needs:
    - job: versions
      artifacts: true
  script:
    - /osv-scanner scan --config=osv-scanner.toml --no-call-analysis=go --recursive $OSV_SCANNER_FLAGS .

govulncheck:
  extends: [.go, .rules-go]
  stage: security
  parallel:
    matrix:
      - MODULE:
          - libs/contracts
          - libs/httpx
          - libs/testx
          - libs/resilient-http-client
          - libs/pgx
          - libs/valkey
          - libs/kafka
          - libs/otelx
          - services/ping
          - services/heartbeat
          - services/tasks
          - services/consumer
  script:
    - cd "$MODULE"
    - govulncheck ./...

hadolint:
  stage: security
  image:
    name: ${DOCKER_HUB}/hadolint/hadolint:v${HADOLINT_VERSION}-debian
    entrypoint: [""]
  needs:
    - job: versions
      artifacts: true
  parallel:
    matrix:
      - DOCKERFILE:
          - services/ping/Dockerfile
          - services/heartbeat/Dockerfile
          - services/tasks/Dockerfile
          - services/consumer/Dockerfile
  script:
    - hadolint --config .hadolint.yaml "$DOCKERFILE"

# ── package: build each image, generate an SBOM, scan for CVEs ────────────────
# syft and grype run from their own pinned images against a `docker save` tar,
# so nothing is curl-installed and no docker socket has to be shared into them.

docker-build-scan:
  extends: [.dind, .rules-docker]
  stage: package
  image: ${DOCKER_HUB}/library/docker:28
  needs:
    - job: versions
      artifacts: true
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    GRYPE_DB_VALIDATE_AGE: "false"
  parallel:
    matrix:
      - SERVICE: [ping, heartbeat, tasks, consumer]
  script:
    # Registry hosts + Go proxy settings go in as build args (value-less form:
    # taken from the job environment, skipped when unset). The dind daemon
    # picks up HTTP_PROXY / HTTPS_PROXY / NO_PROXY from the job variables.
    - |
      docker build --build-arg DOCKER_HUB --build-arg GCR --build-arg VERSION="$CI_COMMIT_SHORT_SHA" \
        --build-arg GOPROXY --build-arg GOSUMDB --build-arg GONOSUMDB --build-arg GOFLAGS \
        --build-arg HTTP_PROXY --build-arg HTTPS_PROXY --build-arg NO_PROXY \
        -f "services/$SERVICE/Dockerfile" -t "golang-basics-$SERVICE:ci" .
    - docker save -o "image-$SERVICE.tar" "golang-basics-$SERVICE:ci"
    - |
      docker run --rm -v "$CI_PROJECT_DIR:/w" -w /w "${DOCKER_HUB}/anchore/syft:v${SYFT_VERSION}" \
        "docker-archive:image-$SERVICE.tar" -o "cyclonedx-json=sbom-$SERVICE.json"
    # Forward only the grype knobs that are set — an empty GRYPE_DB_UPDATE_URL
    # would override grype's default with "".
    - |
      pass=""; for v in GRYPE_DB_VALIDATE_AGE GRYPE_DB_UPDATE_URL GRYPE_DB_AUTO_UPDATE HTTPS_PROXY NO_PROXY; do
        eval "val=\${$v:-}"; [ -n "$val" ] && pass="$pass -e $v"
      done
      # shellcheck disable=SC2086
      docker run --rm -v "$CI_PROJECT_DIR:/w" -w /w $pass \
        "${DOCKER_HUB}/anchore/grype:v${GRYPE_VERSION}" \
        "docker-archive:image-$SERVICE.tar" --config .grype.yaml --fail-on high
    - rm -f "image-$SERVICE.tar"
  artifacts:
    paths:
      - sbom-*.json
    expire_in: 1 week
