# GitLab CI — mirrors .github/workflows/{ci,appsec,docker}.yml.
#
# golang-basics is a go.work workspace; a workspace root is not itself a
# module, so the Go jobs loop over the modules. Neither the module list nor a
# tool version is written in this file:
#
#   • tool pins   — the `versions` job runs scripts/mise-pins.sh over every
#                   mise*.toml and publishes them as a dotenv artifact, which
#                   later jobs use as ordinary variables (even in `image:`);
#   • module sets — every job asks scripts/touched-modules.sh (go.work):
#                   --all, --integration (go.mod requires libs/testx/containers),
#                   --services, --mutation (.gremlins.yaml). Adding a module to
#                   go.work is the whole change.
#
# One job per stage loops over the modules (GitHub fans the same lists out as
# matrices). A generated child pipeline (`trigger: include: artifact:`) would
# give one job per module too; the loop keeps the pipeline readable and costs
# nothing on a warm cache.
#
# Cost model: the module + build cache is warmed once by `prepare` and pulled
# by everything else, Go tools are built once in `prepare` (bin/ artifact),
# scanners run from their own pinned images, and `needs:` turns the stages
# into a DAG so security and packaging do not queue behind the tests.
#
# Closed networks (self-hosted GitLab, no direct internet): every upstream this
# file touches is a variable with the public default — registry hosts
# (DOCKER_HUB / GHCR / GCR), GOPROXY, NODE_DIST_URL, the npm registry
# (npm_config_registry), scanner databases, rule packs. Override them as
# group/project CI/CD variables (same names as .env.example).
#
# Docker-in-Docker: `integration` and `docker-build-scan` need a Docker daemon
# and use the `docker:dind` service, which requires a runner with
# `privileged = true` (config.toml, [runners.docker]). Without privileged
# runners, run the image build with rootless BuildKit instead — image
# ${DOCKER_HUB}/moby/buildkit:rootless, `buildctl-daemonless.sh build
# --frontend dockerfile.v0 --local context=. --local dockerfile=docker
# --opt filename=service.Dockerfile --opt build-arg:SERVICE=… --output
# type=docker,name=…,dest=image.tar` (needs `--security-opt seccomp=unconfined
# --security-opt apparmor=unconfined` on the runner, not privileged) — and point
# testcontainers at a remote Docker host (DOCKER_HOST) for `integration`.

workflow:
  rules:
    # One pipeline per change: MR pipelines for MRs, branch pipelines for the
    # default branch and tags. Without this a push to an MR branch runs twice.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule" # nightly: stress, fuzz, bench, mutation

stages:
  - prepare
  - check
  - test
  - report
  - security
  - package

default:
  # A superseded pipeline is cancelled instead of burning runner minutes.
  interruptible: true
  timeout: 20m

variables:
  GOTOOLCHAIN: local
  # Determinism hygiene (see the GitHub workflow): fixed zone, shuffled order.
  TZ: UTC
  GOFLAGS: -shuffle=on
  COVERPKG: github.com/tracehubmmp/golang-basics/...
  # ── Closed-network knobs — defaults are the public upstreams ──────────────
  # Registry hosts, the prefix of every image:/services: below and passed into
  # `docker build`. Point at a pull-through cache (Harbor proxy project, Nexus
  # docker-proxy, or GitLab's Dependency Proxy for Docker Hub:
  # $CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX).
  DOCKER_HUB: docker.io
  GHCR: ghcr.io
  GCR: gcr.io
  # Go module proxy (GONOSUMDB / GOSUMDB / GOVULNDB are read by the Go tools
  # straight from the environment — set them at group level).
  GOPROXY: https://proxy.golang.org,direct
  # Scanner inputs. SEMGREP_CONFIG: space-separated packs or a directory of
  # vendored rules. OSV_SCANNER_FLAGS: e.g. "--offline --local-db-path /srv/osv".
  # GRYPE_DB_UPDATE_URL / GRYPE_DB_AUTO_UPDATE are forwarded to grype when set.
  SEMGREP_CONFIG: p/owasp-top-ten p/golang
  OSV_SCANNER_FLAGS: ""
  # testcontainers (integration job) prefixes Docker Hub images with this.
  TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ""
  # Node tarballs (contracts + allure-report add Node to a Go / JRE image);
  # pnpm and just then come from the npm registry (npm_config_registry).
  NODE_DIST_URL: https://nodejs.org/dist
  # GitLab only caches paths inside the project directory, so the Go caches are
  # relocated there rather than left in $HOME.
  GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build

# ── Reusable fragments ────────────────────────────────────────────────────────

.cache-pull: &cache-pull
  key:
    files: [go.work.sum]
    prefix: go
  paths:
    - .cache/go-mod
    - .cache/go-build
  policy: pull

# Go jobs: pinned image from mise.toml, warm cache, tools from `prepare` on PATH.
.go:
  image: ${DOCKER_HUB}/library/golang:${GO_VERSION}-bookworm
  needs:
    - job: versions
      artifacts: true
    - job: prepare
      artifacts: true
  cache: *cache-pull
  before_script:
    - export PATH="$CI_PROJECT_DIR/bin:$PATH"

# Node on top of the job image, from NODE_DIST_URL (a mirror in a closed
# network) — no apt, no corepack@latest: pnpm is the mise pin, from the npm
# registry (npm_config_registry).
.node-tarball: &node-tarball
  - curl -fsSL "${NODE_DIST_URL}/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.gz" | tar -xz -C /opt
  - export PATH="/opt/node-v${NODE_VERSION}-linux-x64/bin:$PATH"
  - npm install -g "pnpm@${PNPM_VERSION}"

# Skip the Go pipeline on docs-only merge requests; always run on the default
# branch so nothing merges unverified.
.rules-go:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*.go"
        - "**/go.mod"
        - "**/go.sum"
        - go.work
        - go.work.sum
        - .golangci.yml
        - .gitlab-ci.yml
        - mise*.toml
        - scripts/**/*
        - benchmarks/*.sh
        - docker/**/*
        - api/**/*
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml

.rules-docker:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*.go"
        - "**/go.mod"
        - "**/go.sum"
        - go.work
        - go.work.sum
        - .dockerignore
        - docker/**/*
        - .gitlab-ci.yml
        - mise*.toml

.rules-nightly:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true

# Docker-in-Docker (privileged runner — see the header for the rootless
# BuildKit alternative).
.dind:
  services:
    - name: ${DOCKER_HUB}/library/docker:28-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

# The data services as GitLab `services:` (reachable by alias) — no dind, no
# compose. Same images as docker/deps.yml.
.deps-services:
  services:
    - name: ${DOCKER_HUB}/library/postgres:18-alpine
      alias: postgres
    - name: ${DOCKER_HUB}/valkey/valkey:9.0
      alias: valkey
    - name: ${DOCKER_HUB}/redpandadata/redpanda:v26.1.1
      alias: redpanda
      command:
        - redpanda
        - start
        - --node-id=0
        - --check=false
        - --set
        - redpanda.auto_create_topics_enabled=true
        - --kafka-addr
        - 0.0.0.0:9092
        - --advertise-kafka-addr
        - redpanda:9092
        - --smp=1
        - --memory=1G
        - --reserve-memory=0M
        - --overprovisioned
  variables:
    POSTGRES_DB: app
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app

# ── prepare ───────────────────────────────────────────────────────────────────

# Single source of truth: every pin in mise.toml and the mise.<profile>.toml
# files, as a dotenv artifact. scripts/mise-pins.sh exits non-zero on a
# missing pin, so a typo fails here instead of as a broken `image:` tag later.
versions:
  stage: prepare
  image: ${DOCKER_HUB}/library/alpine:3.22
  script:
    - sh scripts/mise-pins.sh | tee versions.env
    # "temurin-25" → "25" for the eclipse-temurin image tag.
    - echo "JAVA_MAJOR=$(sed -n 's/^JAVA_VERSION=[a-z]*-//p' versions.env)" | tee -a versions.env
  artifacts:
    reports:
      dotenv: versions.env

# Warms the shared module + build cache once and builds the Go-based tools a
# single time, handing them to every later job as an artifact.
prepare:
  stage: prepare
  image: ${DOCKER_HUB}/library/golang:${GO_VERSION}-bookworm
  needs:
    - job: versions
      artifacts: true
  cache:
    <<: *cache-pull
    policy: pull-push
  script:
    - for m in $(scripts/touched-modules.sh --all); do (cd "$m" && go mod download); done
    - mkdir -p bin
    - export GOBIN="$CI_PROJECT_DIR/bin"
    - go install "gotest.tools/gotestsum@v${GOTESTSUM_VERSION}"
    - go install "github.com/boumenot/gocover-cobertura@v${COBERTURA_VERSION}"
    - go install "golang.org/x/vuln/cmd/govulncheck@v${GOVULNCHECK_VERSION}"
    - go install "github.com/vladopajic/go-test-coverage/v2@v${GOTESTCOV_VERSION}"
    - go install "github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v${OAPICODEGEN_VERSION}"
    - go install "github.com/atombender/go-jsonschema@v${GOJSONSCHEMA_VERSION}"
    - go install "github.com/oasdiff/oasdiff@v${OASDIFF_VERSION}"
  artifacts:
    paths: [bin/]
    expire_in: 1 day

# ── check ─────────────────────────────────────────────────────────────────────

# `just fmt-check tidy-check`: gofmt over the module dirs (never `.` — the
# module cache lives under .cache/), and every go.mod tidy on its own.
static:
  extends: [.go, .rules-go]
  stage: check
  script:
    - out="$(gofmt -l $(scripts/touched-modules.sh --all))"; if [ -n "$out" ]; then echo "gofmt needed in:"; echo "$out"; exit 1; fi
    - scripts/tidy-check.sh

# `just lint-sh`, from the pinned shellcheck image.
shellcheck:
  extends: .rules-go
  stage: check
  image:
    name: ${DOCKER_HUB}/koalaman/shellcheck-alpine:v${SHELLCHECK_VERSION}
    entrypoint: [""]
  needs:
    - job: versions
      artifacts: true
  script:
    - shellcheck scripts/*.sh benchmarks/*.sh

# Contracts — exactly `just contracts-check`: TypeSpec compiles to the
# committed OpenAPI (ping + tasks) / JSON Schema, the Go types match, and no
# OpenAPI document breaks against the target branch (oasdiff). The one job
# with Node: the Go image + the Node tarball, then pnpm and just at their mise
# pins from the npm registry (`rust-just` is just's npm distribution).
contracts:
  extends: [.go, .rules-go]
  stage: check
  variables:
    GIT_DEPTH: 0
  before_script:
    - export PATH="$CI_PROJECT_DIR/bin:$PATH"
    - *node-tarball
    - npm install -g "rust-just@${JUST_VERSION}"
    - pnpm install --frozen-lockfile
  script:
    - base="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-$CI_DEFAULT_BRANCH}"
    - git fetch --quiet origin "$base"
    - just contracts-check "origin/$base"

# go vet + golangci-lint over every module — the golangci-lint image ships a
# matching Go toolchain. `-tags e2e` so the e2e suite is checked too.
lint:
  extends: .rules-go
  stage: check
  image: ${DOCKER_HUB}/golangci/golangci-lint:v${GOLANGCI_VERSION}
  needs:
    - job: versions
      artifacts: true
    - job: prepare
      artifacts: true
  cache: *cache-pull
  timeout: 30m
  script:
    - |
      status=0
      for m in $(scripts/touched-modules.sh --all); do
        echo "── $m"
        (cd "$m" && go vet -tags e2e ./... && golangci-lint run --build-tags e2e) || status=1
      done
      test "$status" = 0

# ── test ──────────────────────────────────────────────────────────────────────

# Unit tests of every module. gotestsum writes JUnit per module (MR widget +
# the Allure report); the binary profile (.cover/unit, every workspace package)
# feeds the covdata merge in `coverage`, and a Cobertura file per module gives
# the MR its per-line annotations.
unit:
  extends: [.go, .rules-go]
  stage: test
  timeout: 30m
  script:
    - mkdir -p .cover/unit .reports/junit .reports/cover .reports/cobertura
    - |
      status=0
      for m in $(scripts/touched-modules.sh --all); do
        flat="$(echo "$m" | tr / -)"
        echo "── $m"
        (cd "$m" && gotestsum --format testname --junitfile "$CI_PROJECT_DIR/.reports/junit/unit-$flat.xml" -- \
          -short -race -covermode=atomic -coverprofile="$CI_PROJECT_DIR/.reports/cover/$flat.out" \
          -coverpkg="$COVERPKG" ./... -args -test.gocoverdir="$CI_PROJECT_DIR/.cover/unit") || status=1
        (cd "$m" && gocover-cobertura < "$CI_PROJECT_DIR/.reports/cover/$flat.out" > "$CI_PROJECT_DIR/.reports/cobertura/$flat.xml") || true
      done
      test "$status" = 0
    # The MR percentage: the union of every module's unit run.
    - go tool covdata textfmt -i=.cover/unit -o .reports/cover/unit-merged.out
    - (cd libs/httpx && go tool cover -func="$CI_PROJECT_DIR/.reports/cover/unit-merged.out" | tail -1)
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - .cover/unit/
      - .reports/junit/
    reports:
      junit: .reports/junit/unit-*.xml
      coverage_report:
        coverage_format: cobertura
        path: .reports/cobertura/*.xml

# Docker-backed suites (modules whose go.mod requires libs/testx/containers)
# under -race. GitLab exports CI=true, so a container that cannot start fails
# the job; the host override points testcontainers at the dind service.
integration:
  extends: [.go, .dind, .rules-go]
  stage: test
  timeout: 40m
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: docker
    TESTCONTAINERS_RYUK_DISABLED: "true"
  script:
    - mkdir -p .cover/integration .reports/junit
    - |
      status=0
      for m in $(scripts/touched-modules.sh --integration); do
        flat="$(echo "$m" | tr / -)"
        echo "── $m"
        (cd "$m" && gotestsum --format testname --junitfile "$CI_PROJECT_DIR/.reports/junit/integration-$flat.xml" -- \
          -race -cover -covermode=atomic -coverpkg="$COVERPKG" ./... \
          -args -test.gocoverdir="$CI_PROJECT_DIR/.cover/integration") || status=1
      done
      test "$status" = 0
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - .cover/integration/
      - .reports/junit/
    reports:
      junit: .reports/junit/integration-*.xml

# The Go e2e suite (build tag `e2e`) against cover-instrumented binaries in
# .build/ and Postgres / Valkey / Redpanda as `services:` — the same scope as
# the GitHub job (which uses docker/deps.yml). The wait below is bounded and
# fails the job; it never silently runs on.
e2e:
  extends: [.go, .deps-services, .rules-go]
  stage: test
  variables:
    COVER: "1"
    VERSION: $CI_COMMIT_SHORT_SHA
    GIT_SHA: $CI_COMMIT_SHA
    BUILD_TIME: $CI_COMMIT_TIMESTAMP
    E2E_BIN_DIR: $CI_PROJECT_DIR/.build
    E2E_COVER_DIR: $CI_PROJECT_DIR/.cover/e2e
    E2E_DATABASE_URL: postgres://app:app@postgres:5432/app?sslmode=disable
    E2E_VALKEY_URL: valkey://valkey:6379
    E2E_KAFKA_BROKERS: redpanda:9092
  script:
    - mkdir -p .build "$E2E_COVER_DIR" .reports/junit
    - for s in $(scripts/touched-modules.sh --services); do scripts/build-service.sh "$s" ".build/$s"; done
    - |
      for hp in postgres:5432 valkey:6379 redpanda:9092; do
        timeout 120 bash -c "until (: > /dev/tcp/${hp%%:*}/${hp##*:}) 2>/dev/null; do sleep 1; done" \
          || { echo "dependency $hp not reachable after 120s" >&2; exit 1; }
      done
    - cd e2e && gotestsum --format testname --junitfile "$CI_PROJECT_DIR/.reports/junit/e2e.xml" -- -tags e2e -count=1 ./...
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - .cover/e2e/
      - .reports/junit/
    reports:
      junit: .reports/junit/e2e.xml

# Plain (not cover-instrumented) binaries for Schemathesis, whose image has no Go.
build-services:
  extends: [.go, .rules-go]
  stage: test
  variables:
    VERSION: $CI_COMMIT_SHORT_SHA
    GIT_SHA: $CI_COMMIT_SHA
    BUILD_TIME: $CI_COMMIT_TIMESTAMP
  script:
    - mkdir -p .build
    - for s in $(scripts/touched-modules.sh --services); do scripts/build-service.sh "$s" ".build/$s"; done
  artifacts:
    paths: [.build/]
    expire_in: 1 day

# Generative API testing: Schemathesis (its own pinned image) drives ping and
# tasks with requests generated from their OpenAPI documents; JUnit → Allure.
schemathesis:
  extends: [.deps-services, .rules-go]
  stage: test
  image:
    name: ${DOCKER_HUB}/schemathesis/schemathesis:${SCHEMATHESIS_VERSION}
    entrypoint: [""]
  needs:
    - job: versions
      artifacts: true
    - job: build-services
      artifacts: true
  variables:
    TASKS_DATABASE_URL: postgres://app:app@postgres:5432/app?sslmode=disable
    TASKS_VALKEY_URL: valkey://valkey:6379
    TASKS_KAFKA_BROKERS: redpanda:9092
    JUNIT_DIR: $CI_PROJECT_DIR/.reports/junit
  script:
    - SERVICE_BIN="$CI_PROJECT_DIR/.build/ping" sh scripts/schemathesis.sh ping
    - SERVICE_BIN="$CI_PROJECT_DIR/.build/tasks" sh scripts/schemathesis.sh tasks
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - .reports/junit/
    reports:
      junit: .reports/junit/schemathesis-*.xml

# ── report ────────────────────────────────────────────────────────────────────

# One coverage number for the whole pyramid: unit + integration + e2e (the Go
# harness' GOCOVERDIR) covdata-merged and gated by .testcoverage.yml
# (`just cov-check`). A merge request may not lower it against the default
# branch's last breakdown.
coverage:
  extends: [.go, .rules-go]
  stage: report
  needs:
    - job: versions
      artifacts: true
    - job: prepare
      artifacts: true
    - job: unit
      artifacts: true
    - job: integration
      artifacts: true
    - job: e2e
      artifacts: true
    # master's breakdown from its latest successful pipeline. Optional so the
    # very first pipeline, and one on a fresh fork, still run.
    - project: $CI_PROJECT_PATH
      ref: $CI_DEFAULT_BRANCH
      job: coverage
      artifacts: true
      optional: true
  script:
    - '[ -s coverage-breakdown.json ] && mv coverage-breakdown.json coverage-breakdown-base.json || true'
    - scripts/cover.sh merge
    - |
      if [ -s coverage-breakdown-base.json ] && [ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ]; then
        go-test-coverage --config .testcoverage.yml \
          --diff-base-breakdown-file-name coverage-breakdown-base.json --diff-threshold 0
      else
        go-test-coverage --config .testcoverage.yml
      fi
  artifacts:
    expire_in: 4 weeks # long enough to always have a base for MRs
    paths: [coverage-merged.out, coverage-breakdown.json]

# One Allure HTML report from every suite's JUnit XML (Allure reads JUnit
# natively). allure-commandline is an npm package on a JRE: the pinned
# eclipse-temurin image + the Node tarball + pnpm at its mise pin.
allure-report:
  extends: .rules-go
  stage: report
  image: ${DOCKER_HUB}/library/eclipse-temurin:${JAVA_MAJOR}-jre
  needs:
    - job: versions
      artifacts: true
    - job: unit
      artifacts: true
    - job: integration
      artifacts: true
      optional: true
    - job: e2e
      artifacts: true
      optional: true
    - job: schemathesis
      artifacts: true
      optional: true
  before_script:
    - *node-tarball
    - pnpm install --frozen-lockfile
  script:
    - test -d .reports/junit || { echo "no JUnit results"; exit 0; }
    - rm -rf .reports/allure-results && mkdir -p .reports/allure-results && cp .reports/junit/*.xml .reports/allure-results/
    # categories.json + executor.json from the tracked file and the CI_* variables.
    - bash scripts/allure-meta.sh .reports/allure-results
    - pnpm exec allure generate --clean --single-file -o allure-report .reports/allure-results
  artifacts:
    expire_in: 2 weeks
    paths: [allure-report/]

# Flakiness hunt — nightly: every module three times, shuffled, under -race.
stress:
  extends: [.go, .rules-nightly]
  stage: report
  timeout: 60m
  script:
    - |
      status=0
      for m in $(scripts/touched-modules.sh --all); do
        echo "── $m"; (cd "$m" && go test -short -count=3 -race -shuffle=on ./...) || status=1
      done
      test "$status" = 0

# Fuzzing — nightly: every Fuzz* target for a fixed budget (scripts/fuzz.sh).
fuzz:
  extends: [.go, .rules-nightly]
  stage: report
  timeout: 45m
  script:
    - FUZZTIME=45s scripts/fuzz.sh
  artifacts:
    when: on_failure
    expire_in: 2 weeks
    paths: ["**/testdata/fuzz/"]

# Micro-benchmarks — nightly: benchstat against the default branch's last run
# (its artifact), printed, informational.
bench:
  extends: [.go, .rules-nightly]
  stage: report
  timeout: 45m
  needs:
    - job: versions
      artifacts: true
    - job: prepare
      artifacts: true
    - project: $CI_PROJECT_PATH
      ref: $CI_DEFAULT_BRANCH
      job: bench
      artifacts: true
      optional: true
  script:
    - GOBIN="$CI_PROJECT_DIR/bin" go install "golang.org/x/perf/cmd/benchstat@v${BENCHSTAT_VERSION}"
    - '[ -s bench-head.txt ] && mv bench-head.txt bench-base.txt || true'
    - scripts/bench.sh bench-head.txt
    - '[ -s bench-base.txt ] && benchstat bench-base.txt bench-head.txt || benchstat bench-head.txt'
  artifacts:
    expire_in: 4 weeks
    paths: [bench-head.txt]

# Mutation testing — nightly or by hand, never per MR (one suite run per
# mutant). Every module with a .gremlins.yaml; its thresholds fail the job.
mutation:
  extends: [.go, .rules-nightly]
  stage: report
  timeout: 60m
  script:
    - GOBIN="$CI_PROJECT_DIR/bin" go install "github.com/go-gremlins/gremlins/cmd/gremlins@v${GREMLINS_VERSION}"
    - |
      status=0
      for m in $(scripts/touched-modules.sh --mutation); do
        flat="$(echo "$m" | tr / -)"
        echo "── $m"
        (cd "$m" && GOFLAGS=-count=1 gremlins unleash --output "$CI_PROJECT_DIR/gremlins-$flat.json") || status=1
      done
      test "$status" = 0
  artifacts:
    when: always
    expire_in: 2 weeks
    paths: [gremlins-*.json]

# ── security (AppSec) — mirrors appsec.yml ────────────────────────────────────
# These need neither the tests nor each other: `needs: [versions]` lets them
# start as soon as the pins are known.

secret-detection:
  stage: security
  image:
    name: ${DOCKER_HUB}/zricethezav/gitleaks:v${GITLEAKS_VERSION}
    entrypoint: [""]
  needs:
    - job: versions
      artifacts: true
  variables:
    GIT_DEPTH: 0
  script:
    - gitleaks detect --source . --config .gitleaks.toml --verbose

sast:
  stage: security
  image:
    name: ${DOCKER_HUB}/semgrep/semgrep:${SEMGREP_VERSION}
    entrypoint: [""]
  needs:
    - job: versions
      artifacts: true
  script:
    # Expired `Remove after YYYY-MM-DD` waivers fail here (`just sec-waivers`).
    - sh scripts/check-waivers.sh
    # `semgrep scan`, not `semgrep ci`: no call home to semgrep.dev, no metrics.
    - set -- ; for c in $SEMGREP_CONFIG; do set -- "$@" --config "$c"; done
    - semgrep scan "$@" --error --metrics=off

# osv-scanner from its official image. Call analysis is off: the image bundles
# an older Go than go.work requires and GOTOOLCHAIN=local forbids fetching a
# newer one; reachability is covered by the `govulncheck` job on the pinned
# toolchain.
dependency-scanning:
  stage: security
  image:
    name: ${GHCR}/google/osv-scanner:v${OSV_VERSION}
    entrypoint: [""]
  needs:
    - job: versions
      artifacts: true
  script:
    - /osv-scanner scan --config=osv-scanner.toml --no-call-analysis=go --recursive $OSV_SCANNER_FLAGS .

govulncheck:
  extends: [.go, .rules-go]
  stage: security
  script:
    - |
      status=0
      for m in $(scripts/touched-modules.sh --all); do
        echo "── $m"; (cd "$m" && govulncheck -tags e2e ./...) || status=1
      done
      test "$status" = 0

hadolint:
  stage: security
  image:
    name: ${DOCKER_HUB}/hadolint/hadolint:v${HADOLINT_VERSION}-debian
    entrypoint: [""]
  needs:
    - job: versions
      artifacts: true
  script:
    - find docker -name '*Dockerfile' -print0 | xargs -0 -n1 hadolint --config .hadolint.yaml

# ── package: build each image, generate an SBOM, scan for CVEs ────────────────
# One recipe (docker/service.Dockerfile) for every service: SERVICE, the mise
# Go pin (required) and the build stamp. syft and grype run from their own
# pinned images against a `docker save` tar — nothing curl-installed, no
# docker socket shared into them.

docker-build-scan:
  extends: [.dind, .rules-docker]
  stage: package
  image: ${DOCKER_HUB}/library/docker:28
  timeout: 45m
  needs:
    - job: versions
      artifacts: true
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    GRYPE_DB_VALIDATE_AGE: "false"
  script:
    # Only the grype knobs that are set — an empty GRYPE_DB_UPDATE_URL would
    # override grype's default with "".
    - |
      pass=""; for v in GRYPE_DB_VALIDATE_AGE GRYPE_DB_UPDATE_URL GRYPE_DB_AUTO_UPDATE HTTPS_PROXY NO_PROXY; do
        eval "val=\${$v:-}"; [ -n "$val" ] && pass="$pass -e $v"
      done
    - |
      for s in $(sh scripts/touched-modules.sh --services); do
        echo "── image $s"
        # Registry hosts + Go proxy settings in value-less form: taken from
        # the job environment, skipped when unset.
        docker build --build-arg SERVICE="$s" --build-arg GO_VERSION="$GO_VERSION" \
          --build-arg VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}" --build-arg GIT_SHA="$CI_COMMIT_SHA" \
          --build-arg BUILD_TIME="$CI_COMMIT_TIMESTAMP" \
          --build-arg DOCKER_HUB --build-arg GCR --build-arg GOPROXY --build-arg GOSUMDB --build-arg GONOSUMDB \
          --build-arg HTTP_PROXY --build-arg HTTPS_PROXY --build-arg NO_PROXY \
          -f docker/service.Dockerfile -t "golang-basics-$s:ci" .
        docker save -o "image-$s.tar" "golang-basics-$s:ci"
        docker run --rm -v "$CI_PROJECT_DIR:/w" -w /w "${DOCKER_HUB}/anchore/syft:v${SYFT_VERSION}" \
          "docker-archive:image-$s.tar" -o "cyclonedx-json=sbom-$s.json"
        # shellcheck disable=SC2086
        docker run --rm -v "$CI_PROJECT_DIR:/w" -w /w $pass "${DOCKER_HUB}/anchore/grype:v${GRYPE_VERSION}" \
          "docker-archive:image-$s.tar" --config .grype.yaml --fail-on high
        rm -f "image-$s.tar"
      done
  artifacts:
    paths:
      - sbom-*.json
    expire_in: 1 week
