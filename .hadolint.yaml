# hadolint config — Dockerfile linting for every services/*/Dockerfile.
# Run via `just sec-iac`. Pinning base-image versions to digests is enforced in
# CI; locally we only waive the noisiest rules.
ignored:
  - DL3008 # pin apt versions — we use distroless, apt only in the builder stage
  - DL3059 # multiple consecutive RUN — readability over layer-count here
  - DL3003 # `cd` in RUN — deliberate per-module build (`cd services/<svc> && go build`)

failure-threshold: warning

trustedRegistries:
  - docker.io
  - gcr.io
  - ghcr.io
