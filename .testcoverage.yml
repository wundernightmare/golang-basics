# go-test-coverage — the coverage gate (`just cov-check`, the `coverage` CI job).
#
# Runs on coverage-merged.out: the covdata-merged union of the unit layer
# (`go test -short`), the integration layer (container-backed suites) and the
# e2e layer (cover-instrumented binaries driven by the Go harness in e2e/) — see
# scripts/cover.sh. One number for the whole pyramid, no layer counted twice.
# The thresholds are a ratchet: raise them when coverage improves, lower only
# with a reason in the commit.
#
# Run it through `scripts/cover.sh gate` (`just cov-check` and CI do), never
# bare: the paths below are relative to the workspace root, and the tool only
# sees them that way when it finds a go.mod there — which a go.work workspace
# does not have. Bare, every ^libs/… pattern matches nothing.
profile: coverage-merged.out

# Per-package breakdown of this run. CI keeps master's copy and hands it to a
# PR run as --diff-base-breakdown-file-name: a change may not lower the merged
# total against master, whatever the absolute total is. That is the ratchet
# that stops old code's coverage from hiding new code's.
breakdown-file-name: coverage-breakdown.json

# How far the merged total may fall below master's, in percentage points
# (negative = a drop that is tolerated). Not zero, because the profile is not
# deterministic: the error branches that only a chaos test reaches (a
# connection cut mid-batch in services/tasks/internal/outbox/relay.go — the
# `relay lock` and `read batch` returns) are hit or missed depending on where
# the cut lands. Six CI runs of one commit differed by two statements, 0.03
# points of ~7200. 0.05 is that noise plus one statement, i.e. three
# statements today — a change that leaves more than that uncovered still
# fails, and the file/package floors below are untouched.
# The tool compares totals rounded to 0.01. Read only when a base breakdown is
# passed (CI on a pull request); `just cov-check` locally has none.
# Tighten it back towards 0 when those branches get a deterministic test.
diff:
  threshold: -0.05

# Three floors: the total alone lets one well-tested package carry an
# untested one. The package floor catches a package nobody tests; the file
# floor (lower — a file of glue or a main.go is legitimately thin) catches a
# forgotten file inside an otherwise healthy package.
threshold:
  file: 30      # every file
  package: 50   # every package (overrides below raise it for pure logic)
  total: 70     # unit + integration + e2e merged (set from the first full run; ratchet up)

# Everything a default build compiles and that is not listed here must be in
# the profile: scripts/cover-files.go (run by `cover.sh gate`) fails on a
# file with code that no layer's binaries contained — such a file is not at
# 0%, it is absent, and no threshold above would ever count it.
exclude:
  paths:
    - ^libs/[^/]+/doc\.go$
    - ^libs/testx/      # the harness (testx, testx/containers, testx/contract) is not a coverage target
    - ^libs/kafka/kafkatest/  # the Kafka conformance suite both providers' tests run: test code in a non-_test file
    - /internal/testsupport/  # a service's test fixtures (fakes, builders), imported only by its tests
    - ^libs/secret/compat/  # libs/secret against the config libraries: test code, not a target
    - ^libs/grpcx/integration/  # the gRPC wiring's integration suite: test code, not a target
    - ^libs/resilient-http-client/integration/  # the client's integration suite: test code, not a target
    - ^libs/otelx/integration/  # the collector configuration's integration suite: test code, not a target
    - ^e2e/             # the e2e suite drives binaries; it is test code, not a target
    - ^libs/contracts/  # generated from api/tsp — no logic to cover
    - \.gen\.go$

# Per-package overrides for the parts that are pure logic and must stay high.
override:
  - path: ^libs/httpx$
    threshold: 85
  - path: ^libs/resilient-http-client$
    threshold: 80
  - path: ^libs/grpcx$
    threshold: 80
  - path: ^libs/resilience$
    threshold: 80
  - path: ^libs/secret$
    threshold: 95
