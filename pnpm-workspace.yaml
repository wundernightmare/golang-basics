# pnpm workspace — the Node layer of this monorepo is only the TypeSpec
# contracts (api/) plus two root dev tools: lefthook (git hooks) and
# allure-commandline (`just allure`, needs a JRE from the mise "report"
# profile). No production Go code and no test depends on it. A catalog pins
# shared dependency versions in one place, the way the Rust sibling repo's
# pnpm-workspace.yaml does.
packages:
  - api

# pnpm 11 turns an ignored build script into a hard install failure, so every
# postinstall we actually want has to be approved here (`pnpm approve-builds`).
# lefthook installs the git hook runner.
allowBuilds:
  lefthook: true

# Supply-chain hardening (semgrep p/owasp-top-ten `package_managers.pnpm.*`
# enforces all three). A frozen-lockfile install is unaffected; they bite on
# `pnpm update` / a fresh resolution:
# - a newly published version has to be 7 days old before it resolves — the
#   window in which the recent npm worm packages were pulled;
# - transitive deps may only come from the registry (no git / tarball URLs);
# - a dependency update cannot silently downgrade these settings.
minimumReleaseAge: 10080
blockExoticSubdeps: true
trustPolicy: no-downgrade
# The escape hatch when a release is needed before the window closes is a
# time-boxed `minimumReleaseAgeExclude:` list with the reason and a
# `Remove after YYYY-MM-DD` line — scripts/check-waivers.sh (`just sec`, CI
# sast) fails once that date has passed. None is needed today.

# Transitive CVEs pinned out. Floors as caret ranges: `pnpm update` still moves
# them inside the major, and the release-age window still applies. Drop an
# entry once `pnpm why -r <name>` shows the dependents already require the floor.
overrides:
  fast-uri: ^3.1.8                # GHSA-hrr3-gc8f-f4qj via ajv → @typespec/compiler, @scalar/openapi-parser

catalog:
  "@typespec/compiler": 1.16.0
  "@typespec/http": 1.16.0
  "@typespec/openapi": 1.16.0
  "@typespec/openapi3": 1.16.0
  "@typespec/json-schema": 1.16.0
