# mise profile "appsec" — layered on mise.toml when MISE_ENV includes appsec.
#
#   just setup-appsec                 # = MISE_ENV=appsec mise install
#   just sec | just audit | just docker-scan SVC   (recipes set MISE_ENV)
#
# Versions mirror the Rust sibling repo's pinning so the two drift together.
# CI reads them through scripts/mise-pins.sh and runs each scanner from its
# own version-pinned image (or `go install` for the Go-built ones).

[tools]
semgrep     = "1.175.0"
gitleaks    = "8.30.1"
osv-scanner = "2.5.1"
hadolint    = "2.15.1"

# Container CVE / SBOM — `just docker-scan` / `docker-scan-ci`. syft writes
# the CycloneDX SBOM, grype matches it against the OSV / Debian / Go vuln
# databases and fails on HIGH+ in CI.
syft  = "1.51.1"
grype = "0.118.0"

# Supply-chain signing — cosign in key-mode with `--tlog-upload=false`. No
# Rekor / Sigstore involvement; verify offline against cosign.pub.
cosign = "3.1.3"

# Go-native reachable-vulnerability scan (`just audit`); pinned, not @latest,
# so CI builds it once from a known version.
"go:golang.org/x/vuln/cmd/govulncheck" = "1.7.0"
