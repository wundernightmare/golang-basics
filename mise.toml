# mise tool versions for local development.
#
# Pins the toolchain so clones / worktrees / CI all resolve the same binaries.
# The Go version is also declared in each module's go.mod (`go 1.26.0`); naming
# it here gets us a `go` shim without a shell hook. Node is needed for the e2e
# Playwright suite. golangci-lint is the aggregate Go linter driven by `just
# lint`.
#
# AppSec toolchain (semgrep / gitleaks / osv-scanner / hadolint) is installed by
# `just setup-sec`; checks run via `just sec`. Versions mirror the Rust sibling
# repo's pinning so the two drift together.

[tools]
# Pinned to the latest 1.27.x. The module `go` directives (go.mod / go.work)
# target the same version to match.
go            = "1.27.0"
node          = "26.8"
golangci-lint = "2.13.2"
k6            = "2.2.0"

# ── VS Code Go tooling ────────────────────────────────────────────────────────
# The Go extension otherwise `go install`s these into GOPATH/bin at whatever
# version happens to be latest that day, per machine. Pinning them here makes
# every clone resolve the same binaries, and `.vscode-example/settings.json`
# points the extension at these shims with autoUpdate off so it stops
# installing its own. Bump a version here, then re-run `mise install`.
#
# These use the `go:` backend, i.e. `go install` from source against the Go
# pinned above — the first `mise install` after adding them is slow (a few
# minutes), afterwards they are cached like any other tool.
#
# staticcheck is deliberately absent: .golangci.yml runs the `standard` set,
# which already includes it, and `go.lintTool` is wired to golangci-lint.
"go:golang.org/x/tools/gopls"             = "0.23.0"  # language server
"go:github.com/go-delve/delve/cmd/dlv"    = "1.27.1"  # debugger (F5 / test debugging)
"go:github.com/cweill/gotests/gotests"    = "1.9.0"   # Go: Generate Unit Tests
"go:github.com/fatih/gomodifytags"        = "1.17.0"  # Go: Add/Remove Struct Tags
"go:github.com/josharian/impl"            = "1.5.0"   # Go: Generate Interface Stubs
#
# goplay ("Go: Run on Go Playground") is absent on purpose: its only release is
# v1.0.0 from 2016, which predates Go modules and has no go.mod, so
# `go install …@v1.0.0` fails with "updates to go.mod needed". It cannot be
# pinned; leave the extension to handle it if anyone ever wants that command.

# AppSec — pinned for reproducibility across machines (Linux / macOS / WSL).
# Bump versions here, then re-run `just setup-sec` (idempotent). Each `just
# sec-*` recipe invokes its tool through `mise exec --`, so no shell `mise
# activate` is required.
semgrep     = "1.175.0"
gitleaks    = "8.30.1"
osv-scanner = "2.5.1"
hadolint    = "2.15.1"

# Container CVE / SBOM — used by `just docker-scan` / `docker-scan-ci`. syft
# generates the CycloneDX SBOM, grype matches against the OSV / Debian / Go
# vuln databases and fails on HIGH+ in CI.
syft  = "1.51.1"
grype = "0.118.0"

# Supply-chain signing — cosign in key-mode with `--tlog-upload=false`. No
# Rekor / Sigstore involvement; verify offline against cosign.pub.
cosign = "3.1.3"

[env]
# Go's build/test cache is global + content-addressed — no per-worktree wiring
# needed (unlike the Rust sibling repo's sccache). Nothing to set here; this
# block is a placeholder for service-local env when you add it.
