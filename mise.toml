# mise tool versions — the CORE profile.
#
# Pins the toolchain so clones / worktrees / CI all resolve the same binaries.
# This file holds only what the everyday loop needs (`just ci`, `just
# contracts`, `just e2e`): Go and the Go-side tools, just, shellcheck, and
# Node + pnpm for the TypeSpec contracts in api/ (the only Node code left).
#
# Everything else is an opt-in PROFILE — mise's environment-specific config
# files, `mise.<ENV>.toml`, layered on top of this one when MISE_ENV names
# them (comma-separated for several):
#
#   mise.appsec.toml  semgrep, gitleaks, osv-scanner, hadolint, syft, grype,
#                     cosign, govulncheck             `just setup-appsec`
#   mise.ide.toml     gopls, dlv, gotests, gomodifytags, impl (VS Code)
#                                                     `just setup-ide`
#   mise.perf.toml    k6, benchstat, gremlins, go-test-coverage,
#                     gocover-cobertura               `just setup-perf`
#   mise.report.toml  java (the Allure report renderer) `just setup-report`
#
#   mise install                      # core only (what `just setup` runs)
#   MISE_ENV=appsec mise install      # core + appsec
#   MISE_ENV=appsec,perf mise install # several
#   MISE_ENV=appsec mise exec -- gitleaks …   # how the just recipes call them
#
# Export MISE_ENV in your shell (or .env) to make a profile permanent. A
# profile file needs `mise trust` like this one — `mise trust --all` trusts
# every config file of the worktree at once.
#
# CI never runs `mise install`: scripts/mise-pins.sh reads every mise*.toml
# and hands the pins to both pipelines (image tags, `go install …@vX`).

[tools]
# Pinned to the latest 1.27.x. The module `go` directives (go.mod / go.work)
# target the same version to match; golangci-lint must be built with a Go at
# least as new (see CLAUDE.md "Go version").
go            = "1.27.0"
golangci-lint = "2.13.2"
# just: CI installs the same version — GitHub via extractions/setup-just,
# GitLab from the npm registry (`rust-just`, the just README's npm package,
# so a closed network gets it through its npm mirror). Only bump to a version
# that exists as rust-just on npm.
just          = "1.57.0"
shellcheck    = "0.11.0" # `just lint` runs it over scripts/ and benchmarks/
# TypeSpec (api/) only. Full semver: CI derives image tags from it. pnpm is
# kept equal to package.json's packageManager (corepack is not used).
node = "26.8.2"
pnpm = "11.25.0"

# `go:` backend = `go install` from source against the Go pinned above; the
# first `mise install` compiles them, afterwards they are cached.
#
# gotestsum wraps `go test -json` and writes JUnit (`just test-junit`, the
# GitLab MR widget, the Allure report).
"go:gotest.tools/gotestsum" = "1.13.0"
# Contracts (`just contracts`): TypeSpec (api/, via pnpm) is the source; these
# turn the emitted OpenAPI / JSON Schema into Go types and check compatibility.
"go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen" = "2.8.0"
"go:github.com/atombender/go-jsonschema"                      = "0.24.1"
"go:github.com/oasdiff/oasdiff"                               = "1.31.0"

[env]
# Schemathesis is not a mise tool but a pinned image (scripts/schemathesis.sh
# runs it with docker; the GitLab job uses it as the job image). The tag lives
# here so scripts/mise-pins.sh reads it like every other pin and `mise env`
# exports it locally.
SCHEMATHESIS_VERSION = "4.27.0"
# Load the (gitignored) .env so the mise shims see the same proxy / registry /
# GOPROXY settings `just` loads via `set dotenv-load`. Silently skipped when
# the file is absent — an open-network clone needs no .env at all. Every knob
# is documented in .env.example.
_.file = ".env"
